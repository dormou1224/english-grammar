arrived at five yesterday."], ["while / as", "Συχνά Past Continuous για πράξη σε εξέλιξη στο παρελθόν. Μπορούν να χρησιμοποιηθούν και με άλλους χρόνους.", "While I was cooking, he called.\nWhile I cook, I listen to music."], ["when", "Δεν καθορίζει μόνο του τον χρόνο. Simple Past + Past Continuous για γεγονός μέσα σε διάρκεια. Simple Past + Past Perfect για προηγούμενη πράξη. Επίσης Simple Present για συνήθεια.", "I was reading when he called.\nWhen I arrived, he had left.\nWhen I finish work, I walk home."], ["ever / never", "Present Perfect για εμπειρίες μέχρι τώρα. Past Perfect για εμπειρίες μέχρι ένα σημείο στο παρελθόν. Simple Present / Simple Past για συνήθειες.", "Have you ever flown?\nBefore that trip, I had never flown.\nHe never drinks coffee."], ["already / just / yet", "Συχνά Present Perfect για σχέση με το παρόν. Past Perfect όταν το σημείο αναφοράς είναι στο παρελθόν.", "I have just finished.\nI haven’t finished yet.\nWhen he called, I had already finished."], ["for + διάρκεια", "Present Perfect: κατάσταση από το παρελθόν έως τώρα. Simple Past: τελειωμένη διάρκεια. Past Perfect: διάρκεια μέχρι ένα παρελθοντικό σημείο.", "I have lived here for five years.\nI lived there for five years, then moved.\nBy 2020, I had lived there for five years."], ["since + αφετηρία", "Συχνά Present Perfect μέχρι τώρα ή Past Perfect μέχρι ένα σημείο στο παρελθόν. Μετά το since μπορεί να υπάρχει Simple Past.", "I have known her since 2020.\nI have known her since we met.\nBy 2024, I had known her since 2020."], ["so far, up to now, until now", "Συνήθως Present Perfect: απολογισμός μέχρι τώρα.", "We have completed three exercises so far."], ["recently / lately", "Συχνά Present Perfect. Το recently μπορεί επίσης να συνοδεύει Simple Past για πρόσφατο ολοκληρωμένο γεγονός.", "I have seen her recently.\nI recently bought a bike."], ["today, this week / month / year", "Present Perfect όταν μετράμε γεγονότα σε διάστημα που φτάνει έως τώρα. Simple Past για συγκεκριμένο τελειωμένο γεγονός μέσα στο ίδιο διάστημα.", "I have read two books this week.\nI spoke to her at nine today."], ["by + χρονικό σημείο στο παρελθόν", "Συχνά Past Perfect: ολοκλήρωση μέχρι εκείνο το σημείο. Δεν είναι αποκλειστικό γνώρισμα του χρόνου.", "By eight last night, I had finished my work."], ["by the time + παρελθοντική πρόταση", "Συχνά Simple Past στη δευτερεύουσα + Past Perfect για πράξη ήδη ολοκληρωμένη. Μπορεί να υπάρχει και Past Continuous για κατάσταση σε εξέλιξη.", "By the time we arrived, he had left.\nBy the time we arrived, it was raining."], ["before / after", "Δείχνουν σειρά, αλλά δεν επιβάλλουν Past Perfect. Μπορούν να συνδυάζονται με Simple Past ή με ενεστωτικούς χρόνους.", "After I had eaten, I went out.\nAfter I ate, I went out.\nI brush my teeth before I go to bed."], ["once, twice, three times", "Present Perfect για εμπειρίες έως τώρα. Simple Past σε τελειωμένο διάστημα. Past Perfect έως ένα παρελθοντικό σημείο.", "I have visited Paris twice.\nI visited Paris twice last year.\nBefore 2020, I had visited Paris twice."]]}]}, {"title": "Ρήματα κατάστασης", "blocks": [{"type": "text", "text": "Συνήθως δεν χρησιμοποιούνται σε continuous όταν δηλώνουν κατάσταση. Δεν πρόκειται για απόλυτη απαγόρευση."}, {"type": "table", "headers": ["Κατηγορία", "Ρήματα", "Παραδείγματα"], "rows": [["Γνώση και σκέψη", "know (γνωρίζω), understand (καταλαβαίνω), believe (πιστεύω), remember (θυμάμαι), forget (ξεχνώ), mean (σημαίνω)", "I knew the answer.\nΌχι: I was knowing the answer."], ["Επιθυμία και προτίμηση", "want (θέλω), need (χρειάζομαι), prefer (προτιμώ)", "She wanted a new bike.\nΌχι: She was wanting a new bike."], ["Συναισθήματα", "like (μου αρέσει), love (αγαπώ), hate (μισώ), dislike (δεν μου αρέσει)", "He liked the film.\nΓια ουδέτερο σχολικό λόγο αποφεύγουμε το was liking."], ["Κατοχή και σχέση", "have (έχω / κατέχω), own (κατέχω), possess (κατέχω), belong to (ανήκω σε)", "They had a car.\nΌχι: They were having a car."], ["Εντύπωση και σύσταση", "seem (φαίνομαι), appear (φαίνομαι), resemble (μοιάζω), contain (περιέχω), consist of (αποτελούμαι από)", "The box contained books.\nShe seemed tired."], ["Αισθήσεις ως κατάσταση", "see (βλέπω), hear (ακούω), smell (έχω μυρωδιά), taste (έχω γεύση)", "The soup tasted good.\nI could hear the music."]]}]}, {"title": "Όταν αλλάζει η σημασία", "blocks": [{"type": "table", "headers": ["Ρήμα", "Κατάσταση", "Διαφορετική χρήση"], "rows": [["have", "Κατοχή: She had a bicycle.", "Δραστηριότητα / εμπειρία: She was having a shower when I called."], ["think", "Γνώμη / πεποίθηση: I thought he was right.", "Σκέψη σε εξέλιξη: I was thinking about the problem."], ["see", "Όραση / αντίληψη: I could see the mountains.", "Συνάντηση / επίσκεψη: She was seeing the dentist at five."], ["taste", "Γεύση του πράγματος: The soup tasted salty.", "Δοκιμή: The chef was tasting the soup."], ["smell", "Μυρωδιά του πράγματος: The flowers smelled lovely.", "Ενέργεια: She was smelling the flowers."], ["look", "Εντύπωση: He looked tired.", "Ενέργεια: He was looking at a photograph."], ["feel", "Αίσθημα: I felt tired.", "Μπορεί να χρησιμοποιηθεί και continuous για προσωρινή αίσθηση: I was feeling tired. Επίσης ενέργεια αφής: She was feeling the fabric."], ["be", "Κατάσταση / χαρακτηριστικό: He was rude.", "Προσωρινή συμπεριφορά: He was being rude to the waiter."]]}]}, {"title": "Λέξεις κλειδιά και σειρά γεγονότων", "blocks": [{"type": "text", "text": "Οι λέξεις κλειδιά είναι ενδείξεις, όχι απόλυτοι κανόνες. Στα συγκεκριμένα παρελθοντικά παραδείγματα: By the time + Simple Past, και Past Perfect για την ήδη ολοκληρωμένη πράξη. Before + μεταγενέστερο γεγονός σε Simple Past, με το προγενέστερο σε Past Perfect. After + προγενέστερο γεγονός σε Past Perfect, με το μεταγενέστερο σε Simple Past. Με before/after είναι συχνά σωστός και ο Simple Past και στα δύο μέρη, επειδή η σειρά δηλώνεται ήδη. By + χρονικό σημείο (by midnight) δεν εισάγει δευτερεύουσα πρόταση. Η παραπάνω αντιστοίχιση αφορά αυτά τα παραδείγματα, όχι κάθε χρήση των λ Ενικός → πληθυντικός"], "rows": [["Συνήθως -s", "book → books, king → kings, crown → crowns"], ["Τελικά s, ss, sh, ch, x: -es", "bus → buses, class → classes, brush → brushes, watch → watches, box → boxes"], ["Σύμφωνο + y → ies", "baby → babies, story → stories"], ["Φωνήεν + y: προσθέτουμε -s", "boy → boys, toy → toys"], ["Ορισμένα f/fe → ves", "wolf → wolves, leaf → leaves, knife → knives"], ["Δεν αλλάζουν όλα τα f σε v", "chef → chefs, roof → roofs"], ["Ανώμαλοι", "child → children, man → men, woman → women, foot → feet, tooth → teeth, mouse → mice"], ["Ίδιος τύπος", "sheep → sheep, fish → fish (συνήθης χρήση)"]]}, {"type": "text", "text": "Το a/an δεν μπαίνει μπροστά σε πληθυντικό: a book → books. This is a child. → These are children. Hair για τα μαλλιά είναι συνήθως μη μετρήσιμο: Her hair is long. Glasses και clothes χρησιμοποιούνται εδώ στον πληθυντικό."}, {"type": "table", "headers": ["Ενικός", "Πληθυντικός"], "rows": [["man", "men"], ["woman", "women"], ["child", "children"], ["fish", "fish"], ["mouse", "mice"], ["sheep", "sheep"], ["foot", "feet"], ["tooth", "teeth"], ["person", "people"]]}, {"type": "text", "text": "Πολλά ουσιαστικά σε -f / -fe γίνονται -ves (knife → knives), αλλά υπάρχουν εξαιρέσεις: chef → chefs. Σε -o: potato → potatoes, αλλά photo → photos. Μαθαίνουμε κάθε λέξη μαζί με τον πληθυντικό της."}]}], "junior-revision-quiz": [{"topic": "be", "question": "“Is he brave?” Απάντησε θετικά.", "options": ["Yes, he is.", "Yes, he’s.", "Yes, he has.", "Yes, he are."], "correctIndex": 0, "hint": "Στη θετική σύντομη απάντηση δεν συντομεύουμε το be.", "explanation": "Yes, he is. Δεν γράφουμε Yes, he’s."}, {"topic": "vocabulary", "question": "Τι σημαίνει short;", "options": ["γίγαντας", "κοντός", "άσχημος", "νέος"], "correctIndex": 1, "hint": "Σκέψου τη σημασία της λέξης στις περιγραφές.", "explanation": "short = κοντός."}, {"topic": "possessives", "question": "They are friends. ___ bags are blue.", "options": ["Our", "His", "Their", "Its"], "correctInde  "text": "Δείχνουν σε ποιον ανήκει κάτι και μπαίνουν πριν από ουσιαστικό."}, {"type": "table", "headers": ["Προσωπική αντωνυμία", "Κτητικό επίθετο"], "rows": [["I", "my"], ["you", "your"], ["he", "his"], ["she", "her"], ["it", "its"], ["we", "our"], ["they", "their"]]}, {"type": "text", "text": "Its name is Rex. Its = του. It’s = it is ή it has. My hair, όχι I hair."}]}, {"title": "Have got / has got", "blocks": [{"type": "text", "text": "I/you/we/they have got. He/she/it has got. Χρησιμοποιείται για κατοχή και χαρακτηριστικά."}, {"type": "table", "headers": ["Μορφή", "Παράδειγμα"], "rows": [["Κατάφαση", "She has got glasses. / She’s got glasses."], ["Άρνηση", "She has not got glasses. / She hasn’t got glasses."], ["Ερώτηση", "Has she got glasses?"], ["Θετική σύντομη απάντηση", "Yes, she has."], ["Αρνητική σύντομη απάντηση", "No, she hasn’t."]]}, {"type": "text", "text": "Στις σύντομες απαντήσεις δεν βάζουμε got. Have you got a drum? → Yes, I have. / No, I haven’t."}]}, {"title": "Present Continuous", "blocks": [{"type": "text", "text": "Για πράξη σε εξέλιξη τώρα: am/is/are + ρήμα σε -ing. Ενδείξεις: now, right now, at the moment, Look!, Listen!"}, {"type": "table", "headers": ["Μορφή", "Παράδειγμα"], "rows": [["Κατάφαση", "I am clapping. / I’m clapping."], ["Άρνηση", "I am not clapping. / I’m not clapping."], ["Ερώτηση", "Am I clapping?"], ["Σύντομη απάντηση", "Yes, I am. / No, I’m not."]]}, {"type": "table", "headers": ["Πρόσωπο", "Κατάφαση", "Άρνηση", "Ερώτηση"], "rows": [["I", "I am clapping.", "I am not clapping.", "Am I clapping?"], ["You", "You are clapping.", "You are not clapping.", "Are you clapping?"], ["He", "He is clapping.", "He is not clapping.", "Is he clapping?"], ["She", "She is clapping.", "She is not clapping.", "Is she clapping?"], ["It", "It is clapping.", "It is not clapping.", "Is it clapping?"], ["We", "We are clapping.", "We are not clapping.", "Are we clapping?"], ["They", "They are clapping.", "They are not clapping.", "Are they clapping?"]]}, {"type": "text", "text": "Are you reading? → Yes, I am. / No, I’m not. Is she singing? → Yes, she is. / No, she isn’t."}]}, {"title": "Ορθογραφία του -ing", "blocks": [{"type": "table", "headers": ["Κανόνας", "Παραδείγματα"], "rows": [["Συνήθως προσθέτουμε -ing", "read → reading, draw → drawing"], ["Τελικό e: το αφαιρούμε", "write → writing, dance → dancing"], ["Σε απλά μονοσύλλαβα με ένα τελικό φωνήεν + ένα σύμφωνο, διπλασιάζουμε", "clap → clapping, run → running, swim → swimming"], ["Το y παραμένει", "fly → flying, play → playing"], ["Δεν διπλασιάζουμε w, x, y", "draw → drawing, fix → fixing, play → playing"]]}]}, {"title": "Πληθυντικός ουσιαστικών", "blocks": [{"type": "table", "headers": ["Κανόνας", "Ενικός → πληθυντικός"], "rows": [["Συνήθως -s", "book → books, king → kings, crown → crowns"], ["Τελικά s, ss, sh, ch, x: -es", "bus → buses, class → classes, brush → brushes, watch → watches, box → boxes"], ["Σύμφωνο + y → ies", "baby → babies, story → stories"], ["Φωνήεν + y: προσθέτουμε -s", "boy → boys, toy → toys"], ["Ορισμένα f/fe → ves", "wolf → wolves, leaf → leaves, knife → knives"], ["Δεν αλλάζουν όλα τα f σε v", "chef → chefs, roof → roofs"], ["Ανώμαλοι", "child → children, man → men, woman → women, foot → feet, tooth → teeth, mouse → mice"], ["Ίδιος τύπος", "sheep → sheep, fish → fish (συνήθης χρήση)"]]}, {"type": "text", "text": "Το a/an δεν μπαίνει μπροστά σε πληθυντικό: a book → books. This is a child. → These are children. Hair για τα μαλλιά είναι συνήθως μη μετρήσιμο: Her hair is long. Glasses και clothes χρησιμοποιούνται εδώ στον πληθυντικό."}, {"type": "table", "headers": ["Ενικός", "Πληθυντικός"], "rows": [["man", "men"], ["woman", "women"], ["child", "children"], ["fish", "fish"], ["mouse", "mice"], ["sheep", "sheep"], ["foot", "feet"], ["tooth", "teeth"], ["person", "people"]]}, {"type": "text", "text": "Πολλά ουσιαστικά σε -f / -fe γίνονται -ves (knife → knives), αλλά υπάρχουν εξαιρέσεις: chef → chefs. Σε -o: potato → potatoes, αλλά photo → photos. Μαθαίνουμε κάθε λέξη μαζί με τον πληθυντικό της."}]}, {"title": "Εμφάνιση και χαρακτήρας", "blocks": [{"type": "text", "text": "What does he look like? → εξωτερική εμφάνιση: He is tall. He has got dark hair. What is he like? → χαρακτήρας: He is kind and brave."}, {"type": "text", "text": "Χρησιμοποιούμε το λεξιλόγιο για περιγραφές φανταστικών προσώπων και χαρακτήρων."}]}, {"title": "Λεξιλόγιο και μεταφράσεις", "blocks": [{"type": "table", "headers": ["English", "Ελληνικά"], "rows": [["beautiful", "όμορφος"], ["ugly", "άσχημος"], ["old", "ηλικιωμένος"], ["young", "νέος"], ["brave", "γενναίος"], ["poor", "φτωχός"], ["kind", "ευγενικός"], ["fat", "χοντρός"], ["thin", "αδύνατος"], ["tall", "ψηλός"], ["short", "κοντός"], ["giant", "γίγαντας"], ["chicken", "κότα"], ["sweet", "γλυκός"], ["small", "μικρός"], ["clever", "έξυπνος"], ["long hair", "μακριά μαλλιά"], ["fly", "πετάω"], ["chef", "σεφ"], ["cookbook", "βιβλίο μαγειρικής"], ["straight hair", "ίσια μαλλιά"], ["curly hair", "σγουρά μαλλιά"], ["dark hair", "σκουρόχρωμα μαλλιά"], ["fair hair", "ανοιχτόχρωμα μαλλιά"], ["moustache", "μουστάκι"], ["beard", "μούσι"], ["freckles", "φακίδες"], ["glasses", "γυαλιά"], ["clothes", "ρούχα"], ["wolf", "λύκος"], ["happy", "χαρούμενος"], ["sad", "λυπημένος"], ["scared", "τρομαγμένος"], ["bored", "βαριεστημένος"], ["house", "σπίτι"], ["king", "βασιλιάς"], ["crown", "στέμμα"], ["crab", "καβούρι"], ["drum", "τύμπανο"], ["story", "ιστορία"], ["favourite", "αγαπημένος"], ["World Book Day", "Παγκόσμια Ημέρα Βιβλίου"], ["He’s over there.", "Είναι εκεί πέρα."], ["Look at me!", "Κοίταξέ με!"], ["That’s right!", "Σωστά!"], ["What does he look like?", "Πώς είναι η εξωτερική του εμφάνιση;"], ["What is he like?", "Τι χαρακτήρα έχει;"], ["storybook character", "ήρωας παραμυθιού"]]}]}, {"title": "Can — Μπορώ", "blocks": [{"type": "text", "text": "Το can δείχνει ικανότητα και είναι ίδιο σε όλα τα πρόσωπα. Μετά βάζουμε το βασικό ρήμα χωρίς to: She can swim. Άρνηση: She cannot swim / She c
