_____ you __________ (do) when the lights __________ (go) out?", "answer": "were - doing - went"}, {"question": "The airline __________ just __________ (cancel) our flight.", "answer": "has just cancelled"}, {"question": "Sam __________ (prefer) the green shirt, so he __________ (buy) it yesterday.", "answer": "preferred - bought"}, {"question": "When I __________ (look) for my sandwich, I __________ (realise) that my brother __________ already __________ (eat) it.", "answer": "looked - realised - had already eaten"}, {"question": "We __________ (not / speak) to Alex since Monday.", "answer": "haven’t spoken"}, {"question": "The baby __________ (sleep) when the dog __________ (bark).", "answer": "was sleeping - barked"}, {"question": "__________ your sister __________ (try) this game yet?", "answer": "Has - tried"}, {"question": "Yesterday, the shop assistant __________ (label) all the new boxes.", "answer": "labelled"}, {"question": "By the time Dad __________ (come) home, I __________ (tidy) my room.", "answer": "came - had tidied"}, {"question": "Helen is back home now. She __________ (be) to the dentist.", "answer": "has been"}, {"question": "The children __________ (swim) at four o’clock yesterday afternoon.", "answer": "were swimming"}, {"question": "The mechanic __________ (fix) our car last Tuesday.", "answer": "fixed"}, {"question": "Jack __________ already __________ (admit) his mistake.", "answer": "has already admitted"}, {"question": "When the police __________ (arrive), the thief __________ already __________ (run) away.", "answer": "arrived - had already run"}, {"question": "We __________ (not / go) out last night.", "answer": "didn’t go"}, {"question": "I __________ never __________ (write) a poem in English.", "answer": "have never written"}, {"question": "While Tom __________ (ride) his bike, he __________ (fall).", "answer": "was riding - fell"}, {"question": "By the time the lesson __________ (start), the teacher __________ (copy) the questions onto the board.", "answer": "started - had copied"}, {"question": "My cousins are away this week. They __________ (go) to Spain for a holiday.", "answer": "have gone"}, {"question": "She __________ (open) the window a few minutes ago.", "answer": "opened"}, {"question": "We __________ (know) each other for five years and are still friends.", "answer": "have known"}, {"question": "At ten o’clock yesterday morning, the workers __________ (repair) the road.", "answer": "were repairing"}, {"question": "The children __________ (cry) when their parents __________ (arrive). Their tears were still falling.", "answer": "were crying - arrived"}, {"question": "By the time we __________ (reach) the airport, our flight __________ already __________ (take) off.", "answer": "reached - had already taken"}, {"question": "I __________ just __________ (receive) your message.", "answer": "have just received"}, {"question": "__________ they __________ (enjoy) the party last night?", "answer": "Did - enjoy"}, {"question": "My uncle __________ (travel) abroad many times in his life.", "answer": "has travelled"}, {"question": "While Anna __________ (study), her brothers __________ (play) cards. Both activities were in progress.", "answer": "was studying - were playing"}, {"question": "When Sarah __________ (try) to pay, she __________ (discover) that she __________ (leave) her wallet at home.", "answer": "tried - discovered - had left"}, {"question": "It __________ (snow) heavily last night.", "answer": "snowed"}, {"question": "__________ you ever __________ (be) to a football match?", "answer": "Have - been"}, {"question": "By the time the meeting __________ (begin), the manager __________ (cancel) the afternoon appointments.", "answer": "began - had cancelled"}, {"question": "At six o’clock yesterday evening, I __________ (plan) my birthday party.", "answer": "was planning"}, {"question": "Before yesterday’s test, Ben __________ never __________ (study) French.", "answer": "had never studied"}]};</script></head><body data-page="exercises" data-content="junior-place-exercises"><main><header><h1>Προθέσεις τόπου — Ασκήσεις</h1></header><nav><a href="index.html">Αρχική</a><a href="junior.html">Κεφάλαια B Junior</a></nav><nav><a href="junior-place-quiz.html">Κουίζ</a><a href="junior-place-exercises.html">Ασκήσεις</a><a href="junior-place-rules.html">Κανόνες</a></nav><div id="app" class="card" aria-busy="true">Φόρτωση…</div></main><script>async function loadContent(name){if(window.QUIZ_CONTENT)return window.QUIZ_CONTENT[name];const response=await fetch(`content/${name}.json`);if(!response.ok)throw new Error('Αδυναμία φόρτωσης');return response.json()}
function showContentError(){const app=document.getElementById('app');app.setAttribute('aria-busy','false');app.textContent='Το περιεχόμενο δεν φορτώθηκε. Για τοπική χρήση, άνοιξε τον τοπικό server ή την έκδοση του φακέλου offline. Επίσης έλεγξε ότι το JSON είναι έγκυρο.'}
</script><script>function node(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
const page=document.body.dataset.page;
loadContent(document.body.dataset.content || page).then(data=>{const app=document.getElementById('app');app.replaceChildren();app.setAttribute('aria-busy','false');if(page==='exercises'){app.append(node('p','Γράψε την απάντησή σου και μετά άνοιξε τη λύση. Στις μεταφράσεις μπορεί να υπάρχουν και άλλες σωστές διατυπώσεις.'));let passage='';data.forEach((q,i)=>{if(q.passage&&q.passage!==passage){passage=q.passage;app.append(node('h2','Διάβασε το κείμενο'),node('p',passage))}const s=node('section'),p=node('p',`${i+1}. ${q.question}`),input=node('textarea');input.rows=2;input.setAttribute('aria-label',`Απάντηση άσκησης ${i+1}`);input.placeholder='Η απάντησή σου…';s.append(p,input);if(q.hint){const h=node('details');h.append(node('summary','Βοήθεια'),node('p',q.hint));s.append(h)}const d=node('details');d.className='solution';d.append(node('summary','Εμφάνιση λύσης'),node('p',q.answer));if(q.note)d.append(node('p',q.note));s.append(d);app.append(s)})}else{data.forEach(section=>{const s=node('section');s.className='rule-section';s.append(node('h2',section.title));section.blocks.forEach(b=>{if(b.type==='text')s.append(node('p',b.text));else{const wrap=node('div');wrap.className='tablewrap';const table=node('table'),head=node('thead'),tr=node('tr');b.headers.forEach(h=>{const th=node('th',h);th.scope='col';tr.append(th)});head.append(tr);table.append(head);const body=node('tbody');b.rows.forEach(row=>{const tr=node('tr');row.forEach(cell=>tr.append(node('td',cell)));body.append(tr)});table.append(body);wrap.append(table);s.append(wrap)}});app.append(s)})}}).catch(showContentError);
</script></body></html>
