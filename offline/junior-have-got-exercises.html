</style><script>window.QUIZ_CONTENT={"junior-rules": [{"title": "Το ρήμα be", "blocks": [{"type": "text", "text": "I am, he/she/it is, you/we/they are. Το be περιγράφει ηλικία, χαρακτηριστικά και κατάσταση."}, {"type": "table", "headers": ["Πρόσωπο", "Κατάφαση", "Άρνηση", "Ερώτηση"], "rows": [["I", "I am / I’m", "I am not / I’m not", "Am I?"], ["he / she / it", "is / ’s", "is not / isn’t", "Is he/she/it?"], ["you / we / they", "are / ’re", "are not / aren’t", "Are you/we/they?"]]}, {"type": "text", "text": "Σύντομες απαντήσεις: Yes, I am. No, I’m not. Yes, she is. No, she isn’t. Δεν συντομεύουμε το be στο τέλος θετικής σύντομης απάντησης."}]}, {"title": "Κτητικά επίθετα", "blocks": [{"type": "text", "text": "Δείχνουν σε ποιον ανήκει κάτι και μπαίνουν πριν από ουσιαστικό."}, {"type": "table", "headers": ["Προσωπική αντωνυμία", "Κτητικό επίθετο"], "rows": [["I", "my"], ["you", "your"], ["he", "his"], ["she", "her"], ["it", "its"], ["we", "our"], ["they", "their"]]}, {"type": "text", "text": "Its name is Rex. Its = του. It’s = it is ή it has. My hair, όχι I hair."}]}, {"title": "Have got / has got", "blocks": [{"type": "text", "text": "I/you/we/they have got. He/she/it has got. Χρησιμοποιείται για κατοχή και χαρακτηριστικά."}, {"type": "table", "headers": ["Μορφή", "Παράδειγμα"], "rows": [["Κατάφαση", "She has got glasses. / She’s got glasses."], ["Άρνηση", "She has not got glasses. / She hasn’t got glasses."], ["Ερώτηση", "Has she got glasses?"], ["Θετική σύντομη απάντηση", "Yes, she has."], ["Αρνητική σύντομη απάντηση", "No, she hasn’t."]]}, {"type": "text", "text": "Στις σύντομες απαντήσεις δεν βάζουμε got. Have you got a drum? → Yes, I have. / No, I haven’t."}]}, {"title": "Present Continuous", "blocks": [{"type": "text", "text": "Για πράξη σε εξέλιξη τώρα: am/is/are + ρήμα σε -ing. Ενδείξεις: now, right now, at the moment, Look!, Listen!"}, {"type": "table", "headers": ["Μορφή", "Παράδειγμα"], "rows": [["Κατάφαση", "I am clapping. / I’m clapping."], ["Άρνηση", "I am not clapping. / I’m not clapping."], ["Ερώτηση", "Am I clapping?"], ["Σύντομη απάντηση", "Yes, I am. / No, I’m not."]]}, {"type": "table", "headers": ["Πρόσωπο", "Κατάφαση", "Άρνηση", "Ερώτηση"], "rows": [["I", "I am clapping.", "I am not clapping.", "Am I clapping?"], ["You", "You are clapping.", "You are not clapping.", "Are you clapping?"], ["He", "He is clapping.", "He is not clapping.", "Is he clapping?"], ["She", "She is clapping.", "She is not clapping.", "Is she clapping?"], ["It", "It is clapping.", "It is not clapping.", "Is it clapping?"], ["We", "We are clapping.", "We are not clapping.", "Are we clapping?"], ["They", "They are clapping.", "They are not clapping.", "Are they clapping?"]]}, {"type": "text", "text": "Are you reading? → Yes, I am. / No, I’m not. Is she singing? → Yes, she is. / No, she isn’t."}]}, {"title": "Ορθογραφία του -ing", "blocks": [{"type": "table", "headers": ["Κανόνας", "Παραδείγματα"], "rows": [["Συνήθως προσθέτουμε -ing", "read → reading, draw → drawing"], ["Τελικό e: το αφαιρούμε", "write → writing, dance → dancing"], ["Σε απλά μονοσύλλαβα με ένα τελικό φωνήεν + ένα σύμφωνο, διπλασιάζουμε", "clap → clapping, run → running, swim → swimming"], ["Το y παραμένει", "fly → flying, play → playing"], ["Δεν διπλασιάζουμε w, x, y", "draw → drawing, fix → fixing, play → playing"]]}]}, {"title": "Πληθυντικός ουσιαστικών", "blocks": [{"type": "table", "headers": ["Κανόνας", "Ενικός → πληθυντικός"], "rows": [["Συνήθως -s", "book → books, king → kings, crown → crowns"], ["Τελικά s, ss, sh, ch, x: -es", "bus → buses, class → classes, brush → brushes, watch → watches, box → boxes"], ["Σύμφωνο + y → ies", "baby → babies, story → stories"], ["Φωνήεν + y: προσθέτουμε -s", "boy → boys, toy → toys"], ["Ορισμένα f/fe → ves", "wolf → wolves, leaf → leaves, knife → knives"], ["Δεν αλλάζουν όλα τα f σε v", "chef → chefs, roof → roofs"], ["Ανώμαλοι", "child → children, man → men, woman → women, foot → feet, tooth → teeth, mouse → mice"], ["Ίδιος τύπος", "sheep → sheep, fish → fish (συνήθης χρήση)"]]}, {"type": "text", "text": "Το a/an δεν μπαίνει μπροστά σε πληθυντικό: a book → books. This is a child. → These are children. Hair για τα μαλλιά είναι συνήθως μη μετρήσιμο: Her hair is long. Glasses και clothes χρησιμοποιούνται εδώ στον πληθυντικό."}, {"type": "table", "headers": ["Ενικός", "Πληθυντικός"], "rows": [["man", "men"], ["woman", "women"], ["child", "children"], ["fish", "fish"], ["mouse", "mice"], ["sheep", "sheep"], ["foot", "feet"], ["tooth", "teeth"], ["person", "people"]]}, {"type": "text", "text": "Πολλά ουσιαστικά σε -f / -fe γίνονται -ves (knife → knives), αλλά υπάρχουν εξαιρέσεις: chef → chefs. Σε -o: potato → potatoes, αλλά photo → photos. Μαθαίνουμε κάθε λέξη μαζί με τον πληθυντικό της."}]}, {"title": "Εμφάνιση και χαρακτήρας", "blocks": [{"type": "text", "text": "What does he look like? → εξωτερική εμφάνιση: He is tall. He has got dark hair. What is he like? → χαρακτήρας: He is kind and brave."}, {"type": "text", "text": "Χρησιμοποιούμε το λεξιλόγιο για περιγραφές φανταστικών προσώπων και χαρακτήρων."}]}, {"title": "Λεξιλόγιο και μεταφράσεις", "blocks": [{"type": "table", "headers": ["English", "Ελληνικά"], "rows": [["beautiful", "όμορφος"], ["ugly", "άσχημος"], ["old", "ηλικιωμένος"], ["young", "νέος"], ["brave", "γενναίος"], ["poor", "φτωχός"], ["kind", "ευγενικός"], ["fat", "χοντρός"], ["thin", "αδύνατος"], ["tall", "ψηλός"], ["short", "κοντός"], ["giant", "γίγαντας"], ["chicken", "κότα"], ["sweet", "γλυκός"], ["small", "μικρός"], ["clever", "έξυπνος"], ["long hair", "μακριά μαλλιά"], ["fly", "πετάω"], ["chef", "σεφ"], ["cookbook", "βιβλίο μαγειρικής"], ["straight hair", "ίσια μαλλιά"], ["curly hair", "σγουρά μαλλιά"], ["dark hair", "σκουρόχρωμα μαλλιά"], ["fair hair", "ανοιχτόχρωμα μαλλιά"], ["moustache", "μουστάκι"], ["beard", "μούσι"], ["freckles", "φακίδες"], ["glasses", "γυαλιά"], ["clothes", "ρούχα"], ["wolf", "λύκος"], ["happy", "χαρούμενος"], ["sad", "λυπημένος"], ["scared", "τρομαγμένος"], ["bored", "βαριεστημένος"], ["house", "σπίτι"], ["king", "βασιλιάς"], ["crown", "στέμμα"], ["crab", "καβούρι"], ["drum", "τύμπανο"], ["story", "ιστορία"], ["favourite", "αγαπημένος"], ["World Book Day", "Παγκόσμια Ημέρα Βιβλίου"], ["He’s over there.", "Είναι εκεί πέρα."], ["Look at me!", "Κοίταξέ με!"], ["That’s right!", "Σωστά!"], ["What does he look like?", "Πώς είναι η εξωτερική του εμφάνιση;"], ["What is he like?", "Τι χαρακτήρα έχει;"], ["storybook character", "ήρωας παραμυθιού"]]}]}, {"title": "Can — Μπορώ", "blocks": [{"type": "text", "text": "Το can δείχνει ικανότητα και είναι ίδιο σε όλα τα πρόσωπα. Μετά βάζουμε το βασικό ρήμα χωρίς to: She can swim. Άρνηση: She cannot swim / She can’t swim. Ερώτηση: Can she swim? Σύντομη απάντηση: Yes, she can. / No, she can’t."}]}, {"title": "Προσωπικές αντωνυμίες", "blocks": [{"type": "text", "text": "Οι αντωνυμίες υποκειμένου δηλώνουν ποιος κάνει την πράξη. Οι αντωνυμίες αντικειμένου χρησιμοποιούνται ως αντικείμενο ρήματος ή μετά από πρόθεση: I see her. / Look at him."}, {"type": "table", "headers": ["Υποκείμενο", "Αντικείμενο"], "rows": [["I", "me"], ["you", "you"], ["he", "him"], ["she", "her"], ["it", "it"], ["we", "us"], ["they", "them"]]}]}, {"title": "Προθέσεις τόπου", "blocks": [{"type": "table", "headers": ["Αγγλικά", "Ελληνικά", "Παράδειγμα"], "rows": [["next to", "δίπλα σε", "The chair is next to the table."], ["opposite", "απέναντι από", "The house is opposite the school."], ["behind", "πίσω από", "The cat is behind the box."], ["between", "ανάμεσα σε", "The ball is between the chairs."]]}]}], "junior-pronouns-quiz": [{"topic": "pronouns", "question": "Anna is kind. ___ is my friend.", "options": ["She", "Her", "Him", "They"], "correctIndex": 0, "hint": "Υποκείμενο: I, you, he, she, it, we, they. Αντικείμενο μετά από ρήμα ή πρόθεση: me, you, him, her, it, us, them.", "explanation": "Υποκείμενο: I, you, he, she, it, we, they. Αντικείμενο μετά από ρήμα ή πρόθεση: me, you, him, her, it, us, them."}, {"t  "categories": ["irregular"], "dailyId": "day-17-10"}], "rules": [{"title": "Οι τέσσερις χρόνοι", "blocks": [{"type": "table", "headers": ["Χρόνος", "Σχηματισμός", "Χρήση"], "rows": [["Simple Past", "Αόριστος· άρνηση/ερώτηση: did + βασικός τύπος", "Τελειωμένα γεγονότα και παλιές συνήθειες."], ["Past Continuous", "was/were + -ing", "Πράξη σε εξέλιξη σε παρελθοντική στιγμή."], ["Present Perfect", "have/has + παθητική μετοχή", "Εμπειρία ή αποτέλεσμα μέχρι τώρα."], ["Past Perfect", "had + παθητική μετοχή", "Πράξη πριν από άλλη παρελθοντική στιγμή."]]}]}, {"title": "Have been / have gone", "blocks": [{"type": "text", "text": "Have/has been to: έχει επισκεφθεί ένα μέρος και έχει επιστρέψει. I have been to London twice."}, {"type": "text", "text": "Have/has gone to: έχει φύγει για εκεί και δεν έχει επιστρέψει ακόμη. She has gone to the supermarket."}]}, {"title": "Ορθογραφία", "blocks": [{"type": "table", "headers": ["Περίπτωση", "Κανόνας και παραδείγματα"], "rows": [["Σύμφωνο + y", "Το y γίνεται i πριν από το -ed: study → studied, carry → carried, tidy → tidied, copy → copied, try → tried, cry → cried."], ["Φωνήεν + y", "Κρατάμε το y και προσθέτουμε -ed: play → played, enjoy → enjoyed."], ["Διπλασιασμός συμφώνου", "Σε μονοσύλλαβα με ένα τελικό φωνήεν και ένα σύμφωνο: stop → stopped, drop → dropped, plan → planned."], ["Τονισμένη τελευταία συλλαβή", "Σε πολυσύλλαβα με κατάλληλη κατάληξη διπλασιάζουμε όταν τονίζεται η τελευταία συλλαβή: prefer → preferred, admit → admitted."], ["Άτονη τελευταία συλλαβή", "Δεν διπλασιάζουμε: open → opened, visit → visited."], ["Τελικό l", "Στα βρετανικά αγγλικά, μετά από ένα φωνήεν συνήθως διπλασιάζουμε το τελικό l ακόμη και χωρίς τελικό τονισμό: travel → travelled, cancel → cancelled, label → labelled."], ["Τελικά w, x, y", "Δεν τα διπλασιάζουμε: snow → snowed, fix → fixed, play → played."], ["Ανώμαλα ρήματα", "Δεν ακολουθούν το -ed. Αόριστος / παθητική μετοχή: write → wrote / written, eat → ate / eaten, begin → began / begun, take → took / taken, go → went / gone."]]}]}, {"title": "Ανώμαλα ρήματα", "blocks": [{"type": "table", "headers": ["Βασικός τύπος", "Αόριστος", "Παθητική μετοχή"], "rows": [["be", "was / were", "been"], ["begin", "began", "begun"], ["break", "broke", "broken"], ["bring", "brought", "brought"], ["buy", "bought", "bought"], ["catch", "caught", "caught"], ["choose", "chose", "chosen"], ["come", "came", "come"], ["do", "did", "done"], ["drink", "drank", "drunk"], ["drive", "drove", "driven"], ["eat", "ate", "eaten"], ["fall", "fell", "fallen"], ["feel", "felt", "felt"], ["find", "found", "found"], ["forget", "forgot", "forgotten"], ["get", "got", "got"], ["give", "gave", "given"], ["go", "went", "gone"], ["grow", "grew", "grown"], ["have", "had", "had"], ["hear", "heard", "heard"], ["keep", "kept", "kept"], ["know", "knew", "known"], ["leave", "left", "left"], ["lose", "lost", "lost"], ["make", "made", "made"], ["meet", "met", "met"], ["put", "put", "put"], ["read", "read", "read"], ["ride", "rode", "ridden"], ["run", "ran", "run"], ["say", "said", "said"], ["see", "saw", "seen"], ["send", "sent", "sent"], ["sing", "sang", "sung"], ["sit", "sat", "sat"], ["sleep", "slept", "slept"], ["speak", "spoke", "spoken"], ["stand", "stood", "stood"], ["swim", "swam", "swum"], ["take", "took", "taken"], ["teach", "taught", "taught"], ["think", "thought", "thought"], ["understand", "understood", "understood"], ["wear", "wore", "worn"], ["win", "won", "won"], ["write", "wrote", "written"]]}]}, {"title": "Σύμφωνο + y → ied", "blocks": [{"type": "table", "headers": ["Ρήμα", "Αόριστος / μετοχή"], "rows": [["study", "studied"], ["carry", "carried"], ["try", "tried"], ["cry", "cried"], ["tidy", "tidied"], ["copy", "copied"], ["hurry", "hurried"], ["worry", "worried"], ["marry", "married"], ["reply", "replied"], ["apply", "applied"], ["fry", "fried"], ["dry", "dried"], ["spy", "spied"], ["bury", "buried"], ["empty", "emptied"]]}]}, {"title": "Φωνήεν + y: κρατάμε το y", "blocks": [{"type": "table", "headers": ["Ρήμα", "Αόριστος / μετοχή"], "rows": [["play", "played"], ["enjoy", "enjoyed"], ["stay", "stayed"], ["pray", "prayed"], ["obey", "obeyed"], ["delay", "delayed"], ["destroy", "destroyed"], ["annoy", "annoyed"]]}, {"type": "text", "text": "Ανώμαλα: say – said, pay – paid, buy – bought."}]}, {"title": "Διπλασιασμός συμφώνου", "blocks": [{"type": "table", "headers": ["Ρήμα", "Αόριστος / μετοχή"], "rows": [["stop", "stopped"], ["plan", "planned"], ["drop", "dropped"], ["shop", "shopped"], ["clap", "clapped"], ["rub", "rubbed"], ["rob", "robbed"], ["nod", "nodded"], ["slip", "slipped"], ["skip", "skipped"], ["prefer", "preferred"], ["admit", "admitted"], ["permit", "permitted"], ["occur", "occurred"], ["regret", "regretted"]]}]}, {"title": "Χωρίς διπλασιασμό", "blocks": [{"type": "table", "headers": ["Ρήμα", "Αόριστος / μετοχή", "Γιατί;"], "rows": [["open", "opened", "Άτονη τελευταία συλλαβή"], ["visit", "visited", "Άτονη τελευταία συλλαβή"], ["happen", "happened", "Άτονη τελευταία συλλαβή"], ["listen", "listened", "Άτονη τελευταία συλλαβή"], ["offer", "offered", "Άτονη τελευταία συλλαβή"], ["suffer", "suffered", "Άτονη τελευταία συλλαβή"], ["fix", "fixed", "Τελικό x"], ["snow", "snowed", "Τελικό w"], ["rain", "rained", "Δύο φωνήεντα πριν από το n"], ["help", "helped", "Δύο τελικά σύμφωνα"]]}]}, {"title": "Τελικό l στη βρετανική ορθογραφία", "blocks": [{"type": "table", "headers": ["Ρήμα", "Αόριστος / μετοχή"], "rows": [["travel", "travelled"], ["cancel", "cancelled"], ["label", "labelled"], ["level", "levelled"], ["model", "modelled"], ["signal", "signalled"], ["quarrel", "quarrelled"], ["control", "controlled"]]}]}, {"title": "Παρόμοια χωρίς πρόσθετο l", "blocks": [{"type": "table", "headers": ["Ρήμα", "Αόριστος / μετοχή"], "rows": [["email", "emailed"], ["sail", "sailed"], ["boil", "boiled"], ["fail", "failed"], ["mail", "mailed"]]}]}, {"title": "Λέξεις και φράσεις-κλειδιά", "blocks": [{"type": "text", "text": "Είναι ενδείξεις, όχι απόλυτοι κανόνες. Οι ενεστωτικοί περιλαμβάνονται εδώ μόνο για σύγκριση."}, {"type": "table", "headers": ["Λέξη / φράση", "Πιθανοί χρόνοι", "Παραδείγματα"], "rows": [["every day / week, usually, often, sometimes, always, never", "Simple Present για συνήθειες τώρα. Simple Past για παλιές συνήθειες.", "She usually walks to school.\nWhen she was young, she usually walked to school."], ["now, right now, at the moment", "Συνήθως Present Continuous για πράξη σε εξέλιξη τώρα.", "She is studying now.\nΜε ρήματα κατάστασης μπορεί να έχουμε Simple Present: I understand now."], ["yesterday, last night / week / year, two days ago, in 2020", "Συνήθως Simple Past για ολοκληρωμένο γεγονός σε τελειωμένο χρόνο. Μπορούν να συνοδεύουν Past Continuous όταν περιγράφουμε διάρκεια.", "I visited her yesterday.\nAt eight yesterday, I was studying."], ["at five yesterday, at this time yesterday", "Συχνά Past Continuous: πράξη σε εξέλιξη εκείνη την ώρα. Simple Past αν δηλώνεται ένα γεγονός εκείνη την ώρα.", "At five, I was reading.\nThe train arrived at five yesterday."], ["while / as", "Συχνά Past Continuous για πράξη σε εξέλιξη στο παρελθόν. Μπορούν να χρησιμοποιηθούν και με άλλους χρόνους.", "While I was cooking, he called.\nWhile I cook, I listen to music."], ["when", "Δεν καθορίζει μόνο του τον χρόνο. Simple Past + Past Continuous για γεγονός μέσα σε διάρκεια. Simple Past + Past Perfect για προηγούμενη πράξη. Επίσης Simple Present για συνήθεια.", "I was reading when he called.\nWhen I arrived, he had left.\nWhen I finish work, I walk home."], ["ever / never", "Present Perfect για εμπειρίες μέχρι τώρα. Past Perfect για εμπειρίες μέχρι ένα σημείο στο παρελθόν. Simple Present / Simple Past για συνήθειες.", "Have you ever flown?\nBefore that trip, I had never flown.\nHe never drinks coffee."], ["already / just / yet", "Συχνά Present Perfect για σχέση με το παρόν. Past Perfect όταν το σημείο αναφοράς είναι στο παρελθόν.", "I have just finished.\nI haven’t finished yet.\nWhen he called, I had already finished."], ["for + διάρκεια", "Present Perfect: κατάσταση από το παρελθόν έως τώρα. Simple Past: τελειωμένη διάρκεια. Past Perfect: διάρκεια μέχρι ένα παρελθοντικό σημείο.", "I have lived here for five years.\nI lived there for five years, then moved.\nBy 2020, I had lived there for five years."], ["since + αφετηρία", "Συχνά Present Perfect μέχρι τώρα ή Past Perfect μέχρι ένα σημείο στο παρελθόν. Μετά το since μπορεί να υπάρχει Simple Past.", "I have known her since 2020.\nI have known her since we met.\nBy 2024, I had known her since 2020."], ["so far, up to now, until now", "Συνήθως Present Perfect: απολογισμός μέχρι τώρα.", "We have completed three exercises so far."], ["recently / lately", "Συχνά Present Perfect. Το recently μπορεί επίσης να συνοδεύει Simple Past για πρόσφατο ολοκληρωμένο γεγονός.", "I have seen her recently.\nI recently bought a bike."], ["today, this week / month / year", "Present Perfect όταν μετράμε γεγονότα σε διάστημα που φτάνει έως τώρα. Simple Past για συγκεκριμένο τελειωμένο γεγονός μέσα στο ίδιο διάστημα.", "I have read two books this week.\nI spoke to her at nine today."], ["by + χρονικό σημείο στο παρελθόν", "Συχνά Past Perfect: ολοκλήρωση μέχρι εκείνο το σημείο. Δεν είναι αποκλειστικό γνώρισμα του χρόνου.", "By eight last night, I had finished my work."], ["by the time + παρελθοντική πρόταση", "Συχνά Simple Past στη δευτερεύουσα + Past Perfect για πράξη ήδη ολοκληρωμένη. Μπορεί να υπάρχει και Past Continuous για κατάσταση σε εξέλιξη.", "By the time we arrived, he had left.\nBy the time we arrived, it was raining."], ["before / after", "Δείχνουν σειρά, αλλά δεν επιβάλλουν Past Perfect. Μπορούν να συνδυάζονται με Simple Past ή με ενεστωτικούς χρόνους.", "After I had eaten, I went out.\nAfter I ate, I went out.\nI brush my teeth before I go to bed."], ["once, twice, three times", "Present Perfect για εμπειρίες έως τώρα. Simple Past σε τελειωμένο διάστημα. Past Perfect έως ένα παρελθοντικό σημείο.", "I have visited Paris twice.\nI visited Paris twice last year.\nBefore 2020, I had visited Paris twice."]]}]}, {"title": "Ρήματα κατάστασης", "blocks": [{"type": "text", "text": "Συνήθως δεν χρησιμοποιούνται σε continuous όταν δηλώνουν κατάσταση. Δεν πρόκειται για απόλυτη απαγόρευση."}, {"type": "table", "headers": ["Κατηγορία", "Ρήματα", "Παραδείγματα"], "rows": [["Γνώση και σκέψη", "know (γνωρίζω), understand (καταλαβαίνω), believe (πιστεύω), remember (θυμάμαι), forget (ξεχνώ), mean (σημαίνω)", "I knew the answer.\nΌχι: I was knowing the answer."], ["Επιθυμία και προτίμηση", "want (θέλω), need (χρειάζομαι), prefer (προτιμώ)", "She wanted a new bike.\nΌχι: She was wanting a new bike."], ["Συναισθήματα", "like (μου αρέσει), love (αγαπώ), hate (μισώ), dislike (δεν μου αρέσει)", "He liked the film.\nΓια ουδέτερο σχολικό λόγο αποφεύγουμε το was liking."], ["Κατοχή και σχέση", "have (έχω / κατέχω), own (κατέχω), possess (κατέχω), belong to (ανήκω σε)", "They had a car.\nΌχι: They were having a car."], ["Εντύπωση και σύσταση", "seem (φαίνομαι), appear (φαίνομαι), resemble (μοιάζω), contain (περιέχω), consist of (αποτελούμαι από)", "The box contained books.\nShe seemed tired."], ["Αισθήσεις ως κατάσταση", "see (βλέπω), hear (ακούω), smell (έχω μυρωδιά), taste (έχω γεύση)", "The soup tasted good.\nI could hear the music."]]}]}, {"title": "Όταν αλλάζει η σημασία", "blocks": [{"type": "table", "headers": ["Ρήμα", "Κατάσταση", "Διαφορετική χρήση"], "rows": [["have", "Κατοχή: She had a bicycle.", "Δραστηριότητα / εμπειρία: She was having a shower when I called."], ["think", "Γνώμη / πεποίθηση: I thought he was right.", "Σκέψη σε εξέλιξη: I was thinking about the problem."], ["see", "Όραση / αντίληψη: I could see the mountains.", "Συνάντηση / επίσκεψη: She was seeing the dentist at five."], ["taste", "Γεύση του πράγματος: The soup tasted salty.", "Δοκιμή: The chef was tasting the soup."], ["smell", "Μυρωδιά του πράγματος: The flowers smelled lovely.", "Ενέργεια: She was smelling the flowers."], ["look", "Εντύπωση: He looked tired.", "Ενέργεια: He was looking at a photograph."], ["feel", "Αίσθημα: I felt tired.", "Μπορεί να χρησιμοποιηθεί και continuous για προσωρινή αίσθηση: I was feeling tired. Επίσης ενέργεια αφής: She was feeling the fabric."], ["be", "Κατάσταση / χαρακτηριστικό: He was rude.", "Προσωρινή συμπεριφορά: He was being rude to the waiter."]]}]}, {"title": "Λέξεις κλειδιά και σειρά γεγονότων", "blocks": [{"type": "text", "text": "Οι λέξεις κλειδιά είναι ενδείξεις, όχι απόλυτοι κανόνες. Στα συγκεκριμένα παρελθοντικά παραδείγματα: By the time + Simple Past, και Past Perfect για την ήδη ολοκληρωμένη πράξη. Before + μεταγενέστερο γεγονός σε Simple Past, με το προγενέστερο σε Past Perfect. After + προγενέστερο γεγονός σε Past Perfect, με το μεταγενέστερο σε Simple Past. Με before/after είναι συχνά σωστός και ο Simple Past και στα δύο μέρη, επειδή η σειρά δηλώνεται ήδη. By + χρονικό σημείο (by midnight) δεν εισάγει δευτερεύουσα πρόταση. Η παραπάνω αντιστοίχιση αφορά αυτά τα παραδείγματα, όχι κάθε χρήση των λέξεων σε οποιοδήποτε χρονικό πλαίσιο."}]}, {"title": "Past Continuous και Simple Past: when, while, as", "blocks": [{"type": "text", "text": "Στις ασκήσεις αυτού του προγράμματος, μια πράξη που ήταν ήδη σε εξέλιξη δίνεται με Past Continuous (was/were + -ing). Ένα πιο σύντομο γεγονός που παρεμβάλλεται δίνεται με Simple Past. Η παρέμβαση δεν σημαίνει απαραίτητα ότι η πράξη σταμάτησε οριστικά."}, {"type": "table", "headers": ["Σύνδεσμος", "Ρόλος στο συγκεκριμένο μοτίβο", "Παράδειγμα"], "rows": [["when", "Εισάγει το σύντομο γεγονός, σε Simple Past.", "I was watching TV when the phone rang."], ["while", "Εισάγει την πράξη σε εξέλιξη, σε Past Continuous.", "The phone rang while I was watching TV."], ["as", "Μπορεί να εισάγει την πράξη σε εξέλιξη.", "As I was walking to school, I met Anna."]]}, {"type": "text", "text": "When she arrived, we were having dinner: arrived είναι το σύντομο γεγονός και were having η πράξη σε εξέλιξη. Οι σύνδεσμοι δεν επιβάλλουν πάντα έναν χρόνο σε κάθε χρήση τους. Το while μπορεί επίσης να συνδέσει δύο παράλληλες πράξεις σε Past Continuous."}, {"type": "text", "text": "Για συγκεκριμένη ώρα στο παρελθόν, στο παρόν εκπαιδευτικό πρόγραμμα ζητάμε Past Continuous: At eight yesterday, Dad was not swimming. Ο Simple Past μπορεί σε άλλο πλαίσιο να περιγράφει ένα ολοκληρωμένο γεγονός εκείνη την ώρα, αλλά δεν βαθμολογείται ως σωστός στις συγκεκριμένες ασκήσεις."}]}], "junior-place-exercises": [{"topic": "place", "question": "Η μπάλα είναι δίπλα στο κουτί: The ball is ___ the box.", "answer": "next to", "hint": "next to = δίπλα σε, behind = πίσω από, opposite = απέναντι από, between = ανάμεσα σε."}, {"topic": "place", "question": "Η γάτα είναι πίσω από την καρέκλα: The cat is ___ the chair.", "answer": "behind", "hint": "next to = δίπλα σε, behind = πίσω από, opposite = απέναντι από, between = ανάμεσα σε."}, {"topic": "place", "question": "Το σπίτι είναι απέναντι από το σχολείο: The house is ___ the school.", "answer": "opposite", "hint": "next to = δίπλα σε, behind = πίσω από, opposite = απέναντι από, between = ανάμεσα σε."}, {"topic": "place", "question": "Το παιδί είναι ανάμεσα στα δύο δέντρα: The child is ___ the two trees.", "answer": "between", "hint": "next to = δίπλα σε, behind = πίσω από, opposite = απέναντι από, between = ανάμεσα σε."}, {"topic": "place", "question": "Μετάφρασε στα αγγλικά: Είναι δίπλα στο σπίτι.", "answer": "It is next to the house."}], "daily-30-quiz": [{"type": "typing", "question": "___ the children ever ___ (eat) sushi? Γράψε όλα τα κενά, με τη σειρά, χωρισμένα με / .", "acceptedAnswers": ["have / eaten"], "hint": "Έλεγξε αν η πράξη συνδέεται με το παρόν (π.χ. εμπειρία μέχρι τώρα, since, yet). Πριν σχηματίσεις τον Present Perfect, βρες την αντωνυμία του υποκειμένου: he/she/it → has, I/you/we/they → have. Έπειτα βάλε τη μετοχή του ρήματος.", "explanation": "Το ever ρωτά για εμπειρία μέχρι τώρα: Present Perfect. the children → they: have + eaten. Eat → ate → eaten.", "categories": ["auxiliary", "questio τα βάλε το κύριο ρήμα σε -ing. Πρόσεξε επίσης την ορθογραφία της κατάληξης και αν χρειάζεται αλλαγή του y, αφαίρεση e ή διπλασιασμός συμφώνου.", "explanation": "Το at eight yesterday δηλώνει συγκεκριμένη ώρα στο παρελθόν. Στο πρόγραμμα αυτό βαθμολογούμε μόνο Past Continuous, για πράξη σε εξέλιξη. the children → were. Άρνηση: were + not + swimming. swim → swimming: διπλασιάζουμε το τελικό σύμφωνο.", "categories": ["auxiliary", "negative", "tense", "agreement", "spelling"], "tense": "Past Continuous", "subject": "the children", "dailyId": "day-30-07"}, {"type": "typing", "question": "___ the children ___ (finish) dinner before we ___ (arrive)? Γράψε όλα τα κενά, με τη σειρά, χωρισμένα με / .", "acceptedAnswers": ["had / finished / arrived", "did / finish / arrived"], "hint": "Πρόσεξε τη σειρά των γεγονότων: στο μοτίβο που εξασκούμε, η παλαιότερη πράξη παίρνει Past Perfect (had + μετοχή) και η μεταγενέστερη Simple Past. Το had είναι ίδιο για όλα τα πρόσωπα.", "explanation": "Had + υποκείμενο + finished: ερώτηση για ολοκλήρωση πριν από την άφιξη. Η άφιξη δίνεται με arrived. Επίσης σωστό did / finish / arrived, αφού το before καθορίζει τη χρονική σειρά.", "categories": ["tense", "sequence", "auxiliary"], "tense": "Past Perfect", "subject": "the children", "dailyId": "day-30-08"}, {"type": "typing", "question": "When a window ___ (break), the children ___ (play in the garden). Γράψε όλα τα κενά, με τη σειρά, χωρισμένα με / .", "acceptedAnswers": ["broke / were playing in the garden"], "hint": "Πρόσεξε ποια πράξη είχε διάρκεια και ήταν ήδη σε εξέλιξη: αυτή παίρνει Past Continuous. Το πιο σύντομο γεγονός που παρεμβάλλεται παίρνει Simple Past. Πριν σχηματίσεις τον Past Continuous, βρες την αντωνυμία του υποκειμένου: I/he/she/it → was, you/we/they → were. Έπειτα βάλε το κύριο ρήμα σε -ing.", "explanation": "Μετά το when, το σύντομο γεγονός είναι broke (Simple Past). Η πράξη που ήταν ήδη σε εξέλιξη είναι were playing in the garden (Past Continuous). Σχηματισμός: was/were + ρήμ }, {"type": "text", "text": "Σύντομες απαντήσεις: Yes, I am. No, I’m not. Yes, she is. No, she isn’t. Δεν συντομεύουμε το be στο τέλος θετικής σύντομης απάντησης."}]}, {"title": "Κτητικά επίθετα", "blocks": [{"type": "text", "text": "Δείχνουν σε ποιον ανήκει κάτι και μπαίνουν πριν από ουσιαστικό."}, {"type": "table", "headers": ["Προσωπική αντωνυμία", "Κτητικό επίθετο"], "rows": [["I", "my"], ["you", "your"], ["he", "his"], ["she", "her"], ["it", "its"], ["we", "our"], ["they", "their"]]}, {"type": "text", "text": "Its name is Rex. Its = του. It’s = it is ή it has. My hair, όχι I hair."}]}, {"title": "Have got / has got", "blocks": [{"type": "text", "text": "I/you/we/they have got. He/she/it has got. Χρησιμοποιείται για κατοχή και χαρακτηριστικά."}, {"type": "table", "headers": ["Μορφή", "Παράδειγμα"], "rows": [["Κατάφαση", "She has got glasses. / She’s got glasses."], ["Άρνηση", "She has not got glasses. / She hasn’t got glasses."], ["Ερώτηση", "Has she got glasses?"], ["Θετική σύντομη απάντηση", "Yes, she has."], ["Αρνητική σύντομη απάντηση", "No, she hasn’t."]]}, {"type": "text", "text": "Στις σύντομες απαντήσεις δεν βάζουμε got. Have you got a drum? → Yes, I have. / No, I haven’t."}]}, {"title": "Λεξιλόγιο και μεταφράσεις", "blocks": [{"type": "table", "headers": ["English", "Ελληνικά"], "rows": [["beautiful", "όμορφος"], ["ugly", "άσχημος"], ["old", "ηλικιωμένος"], ["young", "νέος"], ["brave", "γενναίος"], ["poor", "φτωχός"], ["kind", "ευγενικός"], ["fat", "χοντρός"], ["thin", "αδύνατος"], ["tall", "ψηλός"], ["short", "κοντός"], ["giant", "γίγαντας"], ["chicken", "κότα"], ["sweet", "γλυκός"], ["small", "μικρός"], ["clever", "έξυπνος"], ["long hair", "μακριά μαλλιά"], ["fly", "πετάω"], ["chef", "σεφ"], ["cookbook", "βιβλίο μαγειρικής"], ["straight hair", "ίσια μαλλιά"], ["curly hair", "σγουρά μαλλιά"], ["dark hair", "σκουρόχρωμα μαλλιά"], ["fair hair", "ανοιχτόχρωμα μαλλιά"], ["moustache", "μουστάκι"], ["beard", "μούσι"], ["freckles", "φακίδες"], ["glasses", "γυαλιά"], ["clothes", "ρούχα"], ["wolf", "λύκος"], ["happy", "χαρούμενος"], ["sad", "λυπημένος"], ["scared", "τρομαγμένος"], ["bored", "βαριεστημένος"], ["house", "σπίτι"], ["king", "βασιλιάς"], ["crown", "στέμμα"], ["crab", "καβούρι"], ["drum", "τύμπανο"], ["story", "ιστορία"], ["favourite", "αγαπημένος"], ["World Book Day", "Παγκόσμια Ημέρα Βιβλίου"], ["He’s over there.", "Είναι εκεί πέρα."], ["Look at me!", "Κοίταξέ με!"], ["That’s right!", "Σωστά!"], ["What does he look like?", "Πώς είναι η εξωτερική του εμφάνιση;"], ["What is he like?", "Τι χαρακτήρα έχει;"], ["storybook character", "ήρωας παραμυθιού"]]}]}, {"title": "Present Continuous", "blocks": [{"type": "text", "text": "Για πράξη σε εξέλιξη τώρα: am/is/are + ρήμα σε -ing. Ενδείξεις: now, right now, at the moment, Look!, Listen!"}, {"type": "table", "headers": ["Μορφή", "Παράδειγμα"], "rows": [["Κατάφαση", "I am clapping. / I’m clapping."], ["Άρνηση", "I am not clapping. / I’m not clapping."], ["Ερώτηση", "Am I clapping?"], ["Σύντομη απάντηση", "Yes, I am. / No, I’m not."]]}, {"type": "table", "headers": ["Πρόσωπο", "Κατάφαση", "Άρνηση", "Ερώτηση"], "rows": [["I", "I am clapping.", "I am not clapping.", "Am I clapping?"], ["You", "You are clapping.", "You are not clapping.", "Are you clapping?"], ["He", "He is clapping.", "He is not clapping.", "Is he clapping?"], ["She", "She is clapping.", "She is not clapping.", "Is she clapping?"], ["It", "It is clapping.", "It is not clapping.", "Is it clapping?"], ["We", "We are clapping.", "We are not clapping.", "Are we clapping?"], ["They", "They are clapping.", "They are not clapping.", "Are they clapping?"]]}, {"type": "text", "text": "Are you reading? → Yes, I am. / No, I’m not. Is she singing? → Yes, she is. / No, she isn’t."}]}, {"title": "Σύντομοι τύποι του clap", "blocks": [{"type": "table", "headers": ["Πρόσωπο", "Κατάφαση", "Άρνηση"], "rows": [["I", "I’m clapping.", "I’m not clapping."], ["You", "You’re clapping.", "You aren’t clapping."], ["He", "He’s clapping.", "He isn’t clapping."], ["She", "She’s clapping.", "She isn’t clapping."], ["It", "It’s clapping.", "It isn’t clapping."], ["We", "We’re clapping.", "We aren’t clapping."], ["They", "They’re clapping.", "They aren’t clapping."]]}, {"type": "text", "text": "Μπορούμε επίσης να γράψουμε you’re not, he’s not, she’s not, it’s not, we’re not, they’re not. Στις θετικές σύντομες απαντήσεις δεν συντομεύουμε το be: Yes, she is. Στις σύντομες απαντήσεις δεν επαναλαμβάνουμε το ρήμα σε -ing."}]}, {"title": "Ερωτήσεις και σύντομες απαντήσεις", "blocks": [{"type": "table", "headers": ["Ερώτηση", "Ναι", "Όχι"], "rows": [["Are you eating? (σε ένα άτομο)", "Yes, I am.", "No, I’m not."], ["Are you swimming? (σε ομάδα)", "Yes, we are.", "No, we aren’t."], ["Is he running?", "Yes, he is.", "No, he isn’t."], ["Is she dancing?", "Yes, she is.", "No, she isn’t."], ["Is it sleeping?", "Yes, it is.", "No, it isn’t."], ["Are they playing?", "Yes, they are.", "No, they aren’t."]]}]}, {"title": "Ορθογραφία του -ing", "blocks": [{"type": "table", "headers": ["Κανόνας", "Παραδείγματα"], "rows": [["Συνήθως προσθέτουμε -ing", "play → playing, read → reading, eat → eating"], ["Αφαιρούμε το τελικό άφωνο -e", "dance → dancing, write → writing, make → making"], ["Ένα φωνήεν + ένα τελικό σύμφωνο, με τονισμό στην τελευταία συλλαβή: διπλασιάζουμε το σύμφωνο", "run → running, get → getting, swim → swimming, clap → clapping"], ["Χωρίς τονισμό στην τελευταία συλλαβή: δεν διπλασιάζουμε", "open → opening, listen → listening"], ["Δεν διπλασιάζουμε w, x, y", "draw → drawing, fix → fixing, play → playing"], ["Διατηρούμε το y", "fly → flying, study → studying"], ["Το -ie γίνεται -y πριν από το -ing", "lie → lying, die → dying"]]}, {"type": "text", "text": "clap → clapping, με δύο p. Το διπλασιασμένο σύμφωνο είναι μέρος της σωστής ορθογραφίας, σε κατάφαση, άρνηση και ερώτηση."}]}, {"title": "Λέξεις που βοηθούν", "blocks": [{"type": "text", "text": "now, right now, at the moment = τώρα / αυτή τη στιγμή. Τα Look! και Listen! συχνά εισάγουν κάτι που συμβαίνει τώρα. Το today μπορεί να συνοδεύει Present Continuous, όταν περιγράφουμε μια πράξη ή προσωρινή κατάσταση σήμερα, αλλά από μόνο του δεν ορίζει τον χρόνο."}, {"type": "text", "text": "Σχηματισμός: πρόσωπο + am/is/are + -ing. Άρνηση: πρόσωπο + am/is/are + not + -ing. Ερώτηση: Am/Is/Are + πρόσωπο + -ing; Δεν παραλείπουμε το be: She is running."}]}, {"title": "Σύντομες απαντήσεις — χωρίς got", "blocks": [{"type": "text", "text": "Στις σύντομες απαντήσεις κρατάμε μόνο have / has ή haven’t / hasn’t. Δεν επαναλαμβάνουμε το got. Στη θετική απάντηση δεν γράφουμε Yes, I’ve ή Yes, she’s."}, {"type": "table", "headers": ["Ερώτηση", "Θετική απάντηση", "Αρνητική απάντηση"], "rows": [["Have you got a dog?", "Yes, I have.", "No, I haven’t."], ["Has he got a bike?", "Yes, he has.", "No, he hasn’t."], ["Has she got glasses?", "Yes, she has.", "No, she hasn’t."], ["Have they got books?", "Yes, they have.", "No, they haven’t."]]}]}], "junior-present-continuous-quiz": [{"topic": "present-continuous", "question": "Look! The children ___ (clap).", "options": ["are clapping", "is clapping", "are claping", "clap"], "correctIndex": 0, "hint": "Χρειάζεται be και προσοχή στο τελικό p.", "explanation": "Children + are. Clap → clapping με διπλό p."}, {"topic": "present-continuous", "question": "I ___ (read) a story now.", "options": ["is reading", "am reading", "am read", "are reading"], "correctIndex": 1, "hint": "Το now δείχνει πράξη σε εξέλιξη.", "explanation": "I + am + reading."}, {"topic": "present-continuous", "question": "She ___ (write) in her notebook now.", "options": ["is writeing", "are writing", "is writing", "is write"], "correctIndex": 2, "hint": "Πρόσεξε το τελικό e του write.", "explanation": "Write → writing, χωρίς το e."}, {"topic": "present-continuous", "question": "The wolf ___ (run) now.", "options": ["is runing", "are running", "is run", "is running"], "correctIndex": 3, "hint": "Το run έχει ένα τελικό φωνήεν και ένα σύμφωνο ησε οριστικά.", "categories": ["duration-event", "keywords", "auxiliary", "agreement"], "tenses": ["Past Continuous", "Simple Past"], "connector": "while", "dailyId": "day-02-while"}, {"type": "typing", "question": "Before we ___ (arrive), Dad ___ (not finish) dinner. Γράψε όλα τα κενά, με τη σειρά, χωρισμένα με / .", "acceptedAnswers": ["arrived / had not finished", "arrived / hadn’t finished", "arrived / did not finish", "arrived / didn’t finish"], "hint": "Πρόσεξε τη σειρά των γεγονότων: στο μοτίβο που εξασκούμε, η παλαιότερη πράξη παίρνει Past Perfect (had + μετοχή) και η μεταγενέστερη Simple Past. Το had είναι ίδιο για όλα τα πρόσωπα.", "explanation": "Η άφιξη είναι το μεταγενέστερο γεγονός: arrived (Simple Past). Η άλλη πράξη αναφέρεται σε χρόνο πριν από την άφιξη: had + finished, με not στην άρνηση ή had πριν από το υποκείμενο στην ερώτηση. Με before είναι επίσης σωστή η χρήση Simple Past και στα δύο μέρη, όπως στις εναλλακτικές λύσεις.", "categories": ["auxiliary", "negative", "tense", "sequence"], "tense": "Past Perfect", "subject": "Dad", "dailyId": "day-02-09"}, {"type": "typing", "question": "Dad ___ (not eat) anything since this morning.", "acceptedAnswers": ["has not eaten", "hasn’t eaten"], "hint": "Έλεγξε αν η πράξη συνδέεται με το παρόν (π.χ. εμπειρία μέχρι τώρα, since, yet). Πριν σχηματίσεις τον Present Perfect, βρες την αντωνυμία του υποκειμένου: he/she/it → has, I/you/we/they → have. Έπειτα βάλε τη μετοχή του ρήματος.", "explanation": "Το since this morning συνδέει το παρελθόν με το παρόν: Present Perfect. Dad → he: has + eaten. Eat → ate → eaten.", "categories": ["auxiliary", "negative", "tense", "agreement", "irregular"], "tense": "Present Perfect", "subject": "Dad", "dailyId": "day-02-10"}], "junior-present-continuous-rules": [{"title": "Present Continuous", "blocks": [{"type": "text", "text": "Για πράξη σε εξέλιξη τώρα: am/is/are + ρήμα σε -ing. Ενδείξεις: now, right now, at the moment, Look!, Listen!"}, {"type": "table", "headers": ["Μορφή",
