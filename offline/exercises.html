.rule-section{margin:32px 0}.rule-section td{white-space:pre-line}</style><script>window.QUIZ_CONTENT={"quiz": [{"question": "Yesterday, Helen ___ (study) for her English test.", "options": ["studyed", "has studied", "studied", "had studyed"], "correctIndex": 2, "hint": "Πρόσεξε το yesterday και το γράμμα πριν από το y.", "explanation": "Yesterday: Simple Past. Σύμφωνο + y: studied."}, {"question": "While Dad ___ (wash) the car, the phone ___ (ring).", "options": ["was washing — rang", "washed — was ringing", "has washed — has rung", "was wash — ringed"], "correctIndex": 0, "hint": "Μία πράξη ήταν σε εξέλιξη όταν συνέβη η άλλη.", "explanation": "Was washing: πράξη σε εξέλιξη. Rang: σύντομο γεγονός."}, {"question": "I ___ never ___ (eat) sushi.", "options": ["have — ate", "has — eaten", "have — eat", "have — eaten"], "correctIndex": 3, "hint": "Εμπειρία ζωής μέχρι τώρα.", "explanation": "Present Perfect: have + eaten. Eat → ate → eaten."}, {"question": "By the time we ___ (reach) the station, the train ___ already ___ (leave).", "options": ["had reached — left", "reached — had already left", "reached — has already left", "reach — had already leave"], "correctIndex": 1, "hint": "Το τρένο έφυγε πριν φτάσουμε.", "explanation": "Reached: παρελθοντικό σημείο. Had left: προηγούμενη πράξη."}, {"question": "Mum isn’t here. She ___ to the supermarket and hasn’t returned yet.", "options": ["has been", "have gone", "has gone", "has went"], "correctIndex": 2, "hint": "Έχει επιστρέψει;", "explanation": "Has gone: έχει φύγει και δεν έχει επιστρέψει."}, {"question": "They ___ (play) basketball last Saturday.", "options": ["played", "plaied", "have played", "playyed"], "correctIndex": 0, "hint": "Πριν από το y υπάρχει φωνήεν ή σύμφωνο;", "explanation": "Last Saturday: Simple Past. Φωνήεν + y: played."}, {"question": "Συμπλήρωσε με Past Continuous: At eight o’clock last night, we ___ (have) dinner.", "options": ["was having", "were have", "were haveing", "were having"], "correctIndex": 3, "hint": "Το have δηλώνει δραστηριότητα.", "explanation": "We + were having. Το have εδώ σημαίνει δραστηριότητα."}, {"question": "___ you ever ___ (be) to Italy?", "options": ["Has — been", "Have — been", "Have — was", "Did — been"], "correctIndex": 1, "hint": "Ρωτά για εμπειρία επίσκεψης.", "explanation": "Have you ever been to…? Εμπειρία ζωής."}, {"question": "When Anna ___ (open) her bag, she ___ (realise) that she ___ (forget) her keys.", "options": ["opened — realised — had forgotten", "openned — realised — had forgotten", "opened — realised — had forgot", "opened — realised — has forgotten"], "correctIndex": 0, "hint": "Η παράλειψη έγινε πριν ανοίξει την τσάντα.", "explanation": "Opened / realised: αόριστος. Had forgotten: προηγούμενη παράλειψη. Το open δεν διπλασιάζει το n."}, {"question": "The bus ___ (stop) outside our school yesterday.", "options": ["stoped", "has stopped", "stopped", "stopt"], "correctIndex": 2, "hint": "Το stop είναι μονοσύλλαβο.", "explanation": "Stop → stopped, με διπλό p."}, {"question": "We ___ (not / finish) our project yet.", "options": ["haven’t finish", "haven’t finished", "hasn’t finished", "haven’t finishing"], "correctIndex": 1, "hint": "Το έργο δεν έχει ολοκληρωθεί μέχρι τώρα.", "explanation": "We + haven’t finished: εκκρεμότητα έως τώρα."}, {"question": "While I ___ (walk) home, I ___ (see) an old friend.", "options": ["was walking — seen", "was walk — saw", "was walking — seed", "was walking — saw"], "correctIndex": 3, "hint": "Το περπάτημα είναι το πλαίσιο της συνάντησης.", "explanation": "Was walking: διάρκεια. Saw: αόριστος του see."}, {"question": "By the time the guests ___ (arrive), Mum ___ (prepare) dinner.", "options": ["arrived — has prepared", "had arrived — prepared", "arrived — had prepared", "arrived — had prepare"], "correctIndex": 2, "hint": "Το δείπνο είχε ετοιμαστεί πριν από την άφιξη.", "explanation": "Arrived: αόριστος. Had prepared: προγενέστερη ολοκλήρωση."}, {"question": "My parents ___ (travel) to London last summer. Χρησιμοποίησε βρετανική ορθογραφία.", "options": ["travelled", "travellied", "have travelled", "travelleded"], "correctIndex": 0, "hint": "Θυμήσου τη βρετανική ορθογραφία του τελικού l.", "explanation": "Last summer: Simple Past. Βρετανική ορθογραφία: travelled."}, {"question": "“Where are Tom and Ben?” “They ___ to the park. They’ll be back soon.”", "options": ["have been", "have gone", "has gone", "have went"], "correctIndex": 1, "hint": "Απουσιάζουν ακόμη.", "explanation": "They + have gone: δεν έχουν επιστρέψει."}, {"question": "Jack ___ (drop) his phone yesterday.", "options": ["droped", "has dropped", "dropt", "dropped"], "correctIndex": 3, "hint": "Έλεγξε το τελικό σύμφωνο.", "explanation": "Drop → dropped με διπλό p."}, {"question": "Συμπλήρωσε με Past Continuous: At this time yesterday, Mary ___ (write) an email.", "options": ["was writing", "were writing", "was writeing", "was written"], "correctIndex": 0, "hint": "Mary: ενικός και τύπος -ing.", "explanation": "Mary + was writing. Αφαιρούμε το e πριν από το -ing."}, {"question": "She ___ just ___ (carry) the shopping into the kitchen.", "options": ["has — carryed", "have — carried", "has — carried", "has — carrying"], "correctIndex": 2, "hint": "Πρόσφατη ολοκλήρωση και σύμφωνο + y.", "explanation": "She + has carried. Σύμφωνο + y → ied."}, {"question": "When we ___ (get) to the cinema, we ___ (discover) that the film ___ already ___ (begin).", "options": ["got — discovered — had already began", "got — discovered — has already begun", "getted — discovered — had already begun", "got — discovered — had already begun"], "correctIndex": 3, "hint": "Η έναρξη προηγήθηκε της άφιξης.", "explanation": "Got / discovered: αόριστος. Had begun: προηγούμενη έναρξη."}, {"question": "We ___ (enjoy) the school trip last Friday.", "options": ["enjoied", "enjoyed", "have enjoyed", "enjoyyed"], "correctIndex": 1, "hint": "Ποιο γράμμα προηγείται του y;", "explanation": "Last Friday: Simple Past. Φωνήεν + y: enjoyed."}], "exercises": [{"question": "Yesterday, Helen __________ (study) for her English test.", "answer": "studied"}, {"question": "While Dad __________ (wash) the car, the phone __________ (ring).", "answer": "was washing - rang"}, {"question": "I __________ never __________ (eat) sushi.", "answer": "have never eaten"}, {"question": "By the time we __________ (reach) the station, the train __________ already __________ (leave).", "answer": "reached - had already left"}, {"question": "Mum isn’t here. She __________ (go) to the supermarket and hasn’t returned yet.", "answer": "has gone"}, {"question": "They __________ (play) basketball last Saturday.", "answer": "played"}, {"question": "At eight o’clock last night, we __________ (have) dinner.", "answer": "were having"}, {"question": "__________ you ever __________ (be) to Italy?", "answer": "Have - been"}, {"question": "When Anna __________ (open) her bag, she __________ (realise) that she __________ (forget) her keys.", "answer": "opened - realised - had forgotten"}, {"question": "The bus __________ (stop) outside our school yesterday.", "answer": "stopped"}, {"question": "We __________ (not / finish) our project yet.", "answer": "haven’t finished"}, {"question": "While I __________ (walk) home, I __________ (see) an old friend.", "answer": "was walking - saw"}, {"question": "By the time the guests __________ (arrive), Mum __________ (prepare) dinner.", "answer": "arrived - had prepared"}, {"question": "My parents __________ (travel) to London last summer.", "answer": "travelled"}, {"question": "“Where are Tom and Ben?” “They __________ (go) to the park. They’ll be back soon.”", "answer": "have gone"}, {"question": "Jack __________ (drop) his phone yesterday.", "answer": "dropped"}, {"question": "At this time yesterday, Mary __________ (write) an email.", "answer": "was writing"}, {"question": "She __________ just __________ (carry) the shopping into the kitchen.", "answer": "has just carried"}, {"question": "When we __________ (get) to the cinema, we __________ (discover) that the film __________ already __________ (begin).", "answer": "got - discovered - had already begun"}, {"question": "We __________ (enjoy) the school trip last Friday.", "answer": "enjoyed"}, {"question": "__________ you __________ (see) George yesterday?", "answer": "Did - see"}, {"question": "I __________ (be) to that museum twice. Both visits were wonderful.", "answer": "have been"}, {"question": "While Mum __________ (cook), Dad __________ (read) a newspaper. Both activities were in progress.", "answer": "was cooking - was reading"}, {"question": "By the time the teacher __________ (enter), the students __________ (stop) talking.", "answer": "entered - had stopped"}, {"question": "They __________ already __________ (plan) their summer holiday.", "answer": "have already planned"}, {"question": "Lucy __________ (visit) her grandparents last weekend.", "answer": "visited"}, {"question": "What __________ you __________ (do) when the lights __________ (go) out?", "answer": "were - doing - went"}, {"question": "The airline __________ just __________ (cancel) our flight.", "answer": "has just cancelled"}, {"question": "Sam __________ (prefer) the green shirt, so he __________ (buy) it yesterday.", "answer": "preferred - bought"}, {"question": "When I __________ (look) for my sandwich, I __________ (realise) that my brother __________ already __________ (eat) it.", "answer": "looked - realised - had already eaten"}, {"question": "We __________ (not / speak) to Alex since Monday.", "answer": "haven’t spoken"}, {"question": "The baby __________ (sleep) when the dog __________ (bark).", "answer": "was sleeping - barked"}, {"question": "__________ your sister __________ (try) this game yet?", "answer": "Has - tried"}, {"question": "Yesterday, the shop assistant __________ (label) all the new boxes.", "answer": "labelled"}, {"question": "By the time Dad __________ (come) home, I __________ (tidy) my room.", "answer": "came - had tidied"}, {"question": "Helen is back home now. She __________ (be) to the dentist.", "answer": "has been"}, {"question": "The children __________ (swim) at four o’clock yesterday afternoon.", "answer": "were swimming"}, {"question": "The mechanic __________ (fix) our car last Tuesday.", "answer": "fixed"}, {"question": "Jack __________ already __________ (admit) his mistake.", "answer": "has already admitted"}, {"question": "When the police __________ (arrive), the thief __________ already __________ (run) away.", "answer": "arrived - had already run"}, {"question": "We __________ (not / go) out last night.", "answer": "didn’t go"}, {"question": "I __________ never __________ (write) a poem in English.", "answer": "have never written"}, {"question": "While Tom __________ (ride) his bike, he __________ (fall).", "answer": "was riding - fell"}, {"question": "By the time the lesson __________ (start), the teacher __________ (copy) the questions onto the board.", "answer": "started - had copied"}, {"question": "My cousins are away this week. They __________ (go) to Spain for a holiday.", "answer": "have gone"}, {"question": "She __________ (open) the window a few minutes ago.", "answer": "opened"}, {"question": "We __________ (know) each other for five years and are still friends.", "answer": "have known"}, {"question": "At ten o’clock yesterday morning, the workers __________ (repair) the road.", "answer": "were repairing"}, {"question": "The children __________ (cry) when their parents __________ (arrive). Their tears were still falling.", "answer": "were crying - arrived"}, {"question": "By the time we __________ (reach) the airport, our flight __________ already __________ (take) off.", "answer": "reached - had already taken"}, {"question": "I __________ just __________ (receive) your message.", "answer": "have just received"}, {"question": "__________ they __________ (enjoy) the party last night?", "answer": "Did - enjoy"}, {"question": "My uncle __________ (travel) abroad many times in his life.", "answer": "has travelled"}, {"question": "While Anna __________ (study), her brothers __________ (play) cards. Both activities were in progress.", "answer": "was studying - were playing"}, {"question": "When Sarah __________ (try) to pay, she __________ (discover) that she __________ (leave) her wallet at home.", "answer": "tried - discovered - had left"}, {"question": "It __________ (snow) heavily last night.", "answer": "snowed"}, {"question": "__________ you ever __________ (be) to a football match?", "answer": "Have - been"}, {"question": "By the time the meeting __________ (begin), the manager __________ (cancel) the afternoon appointments.", "answer": "began - had cancelled"}, {"question": "At six o’clock yesterday evening, I __________ (plan) my birthday party.", "answer": "was planning"}, {"question": "Before yesterday’s test, Ben __________ never __________ (study) French.", "answer": "had never studied"}], "rules": [{"title": "Οι τέσσερις χρόνοι", "blocks": [{"type": "table", "headers": ["Χρόνος", "Σχηματισμός", "Χρήση"], "rows": [["Simple Past", "Αόριστος· άρνηση/ερώτηση: did + βασικός τύπος", "Τελειωμένα γεγονότα και παλιές συνήθειες."], ["Past Continuous", "was/were + -ing", "Πράξη σε εξέλιξη σε παρελθοντική στιγμή."], ["Present Perfect", "have/has + παθητική μετοχή", "Εμπειρία ή αποτέλεσμα μέχρι τώρα."], ["Past Perfect", "had + παθητική μετοχή", "Πράξη πριν από άλλη παρελθοντική στιγμή."]]}]}, {"title": "Have been / have gone", "blocks": [{"type": "text", "text": "Have/has been to: έχει επισκεφθεί ένα μέρος και έχει επιστρέψει. I have been to London twice."}, {"type": "text", "text": "Have/has gone to: έχει φύγει για εκεί και δεν έχει επιστρέψει ακόμη. She has gone to the supermarket."}]}, {"title": "Ορθογραφία", "blocks": [{"type": "table", "headers": ["Περίπτωση", "Κανόνας και παραδείγματα"], "rows": [["Σύμφωνο + y", "Το y γίνεται i πριν από το -ed: study → studied, carry → carried, tidy → tidied, copy → copied, try → tried, cry → cried."], ["Φωνήεν + y", "Κρατάμε το y και προσθέτουμε -ed: play → played, enjoy → enjoyed."], ["Διπλασιασμός συμφώνου", "Σε μονοσύλλαβα με ένα τελικό φωνήεν και ένα σύμφωνο: stop → stopped, drop → dropped, plan → planned."], ["Τονισμένη τελευταία συλλαβή", "Σε πολυσύλλαβα με κατάλληλη κατάληξη διπλασιάζουμε όταν τονίζεται η τελευταία συλλαβή: prefer → preferred, admit → admitted."], ["Άτονη τελευταία συλλαβή", "Δεν διπλασιάζουμε: open → opened, visit → visited."], ["Τελικό l", "Στα βρετανικά αγγλικά, μετά από ένα φωνήεν συνήθως διπλασιάζουμε το τελικό l ακόμη και χωρίς τελικό τονισμό: travel → travelled, cancel → cancelled, label → labelled."], ["Τελικά w, x, y", "Δεν τα διπλασιάζουμε: snow → snowed, fix → fixed, play → played."], ["Ανώμαλα ρήματα", "Δεν ακολουθούν το -ed. Αόριστος / παθητική μετοχή: write → wrote / written, eat → ate / eaten, begin → began / begun, take → took / taken, go → went / gone."]]}]}, {"title": "Ανώμαλα ρήματα", "blocks": [{"type": "table", "headers": ["Βασικός τύπος", "Αόριστος", "Παθητική μετοχή"], "rows": [["be", "was / were", "been"], ["begin", "began", "begun"], ["break", "broke", "broken"], ["bring", "brought", "brought"], ["buy", "bought", "bought"], ["catch", "caught", "caught"], ["choose", "chose", "chosen"], ["come", "came", "come"], ["do", "did", "done"], ["drink", "drank", "drunk"], ["drive", "drove", "driven"], ["eat", "ate", "eaten"], ["fall", "fell", "fallen"], ["feel", "felt", "felt"], ["find", "found", "found"], ["forget", "forgot", "forgotten"], ["get", "got", "got"], ["give", "gave", "given"], ["go", "went", "gone"], ["grow", "grew", "grown"], ["have", "had", "had"], ["hear", "heard", "heard"], ["keep", "kept", "kept"], ["know", "knew", "known"], ["leave", "left", "left"], ["lose", "lost", "lost"], ["make", "made", "made"], ["meet", "met", "met"], ["put", "put", "put"], ["read", "read", "read"], ["ride", "rode", "ridden"], ["run", "ran", "run"], ["say", "said", "said"], ["see", "saw", "seen"], ["send", "sent", "sent"], ["sing", "sang", "sung"], ["sit", "sat", "sat"], ["sleep", "slept", "slept"], ["speak", "spoke", "spoken"], ["stand", "stood", "stood"], ["swim", "swam", "swum"], ["take", "took", "taken"], ["teach", "taught", "taught"], ["think", "thought", "thought"], ["understand", "understood", "understood"], ["wear", "wore", "worn"], ["win", "won", "won"], ["write", "wrote", "written"]]}]}, {"title": "Σύμφωνο + y → ied", "blocks": [{"type": "table", "headers": ["Ρήμα", "Αόριστος / μετοχή"], "rows": [["study", "studied"], ["carry", "carried"], ["try", "tried"], ["cry", "cried"], ["tidy", "tidied"], ["copy", "copied"], ["hurry", "hurried"], ["worry", "worried"], ["marry", "married"], ["reply", "replied"], ["apply", "applied"], ["fry", "fried"], ["dry", "dried"], ["spy", "spied"], ["bury", "buried"], ["empty", "emptied"]]}]}, {"title": "Φωνήεν + y: κρατάμε το y", "blocks": [{"type": "table", "headers": ["Ρήμα", "Αόριστος / μετοχή"], "rows": [["play", "played"], ["enjoy", "enjoyed"], ["stay", "stayed"], ["pray", "prayed"], ["obey", "obeyed"], ["delay", "delayed"], ["destroy", "destroyed"], ["annoy", "annoyed"]]}, {"type": "text", "text": "Ανώμαλα: say – said, pay – paid, buy – bought."}]}, {"title": "Διπλασιασμός συμφώνου", "blocks": [{"type": "table", "headers": ["Ρήμα", "Αόριστος / μετοχή"], "rows": [["stop", "stopped"], ["plan", "planned"], ["drop", "dropped"], ["shop", "shopped"], ["clap", "clapped"], ["rub", "rubbed"], ["rob", "robbed"], ["nod", "nodded"], ["slip", "slipped"], ["skip", "skipped"], ["prefer", "preferred"], ["admit", "admitted"], ["permit", "permitted"], ["occur", "occurred"], ["regret", "regretted"]]}]}, {"title": "Χωρίς διπλασιασμό", "blocks": [{"type": "table", "headers": ["Ρήμα", "Αόριστος / μετοχή", "Γιατί;"], "rows": [["open", "opened", "Άτονη τελευταία συλλαβή"], ["visit", "visited", "Άτονη τελευταία συλλαβή"], ["happen", "happened", "Άτονη τελευταία συλλαβή"], ["listen", "listened", "Άτονη τελευταία συλλαβή"], ["offer", "offered", "Άτονη τελευταία συλλαβή"], ["suffer", "suffered", "Άτονη τελευταία συλλαβή"], ["fix", "fixed", "Τελικό x"], ["snow", "snowed", "Τελικό w"], ["rain", "rained", "Δύο φωνήεντα πριν από το n"], ["help", "helped", "Δύο τελικά σύμφωνα"]]}]}, {"title": "Τελικό l στη βρετανική ορθογραφία", "blocks": [{"type": "table", "headers": ["Ρήμα", "Αόριστος / μετοχή"], "rows": [["travel", "travelled"], ["cancel", "cancelled"], ["label", "labelled"], ["level", "levelled"], ["model", "modelled"], ["signal", "signalled"], ["quarrel", "quarrelled"], ["control", "controlled"]]}]}, {"title": "Παρόμοια χωρίς πρόσθετο l", "blocks": [{"type": "table", "headers": ["Ρήμα", "Αόριστος / μετοχή"], "rows": [["email", "emailed"], ["sail", "sailed"], ["boil", "boiled"], ["fail", "failed"], ["mail", "mailed"]]}]}, {"title": "Λέξεις και φράσεις-κλειδιά", "blocks": [{"type": "text", "text": "Είναι ενδείξεις, όχι απόλυτοι κανόνες. Οι ενεστωτικοί περιλαμβάνονται εδώ μόνο για σύγκριση."}, {"type": "table", "headers": ["Λέξη / φράση", "Πιθανοί χρόνοι", "Παραδείγματα"], "rows": [["every day / week, usually, often, sometimes, always, never", "Simple Present για συνήθειες τώρα. Simple Past για παλιές συνήθειες.", "She usually walks to school.\nWhen she was young, she usually walked to school."], ["now, right now, at the moment", "Συνήθως Present Continuous για πράξη σε εξέλιξη τώρα.", "She is studying now.\nΜε ρήματα κατάστασης μπορεί να έχουμε Simple Present: I understand now."], ["yesterday, last night / week / year, two days ago, in 2020", "Συνήθως Simple Past για ολοκληρωμένο γεγονός σε τελειωμένο χρόνο. Μπορούν να συνοδεύουν Past Continuous όταν περιγράφουμε διάρκεια.", "I visited her yesterday.\nAt eight yesterday, I was studying."], ["at five yesterday, at this time yesterday", "Συχνά Past Continuous: πράξη σε εξέλιξη εκείνη την ώρα. Simple Past αν δηλώνεται ένα γεγονός εκείνη την ώρα.", "At five, I was reading.\nThe train arrived at five yesterday."], ["while / as", "Συχνά Past Continuous για πράξη σε εξέλιξη στο παρελθόν. Μπορούν να χρησιμοποιηθούν και με άλλους χρόνους.", "While I was cooking, he called.\nWhile I cook, I listen to music."], ["when", "Δεν καθορίζει μόνο του τον χρόνο. Simple Past + Past Continuous για γεγονός μέσα σε διάρκεια. Simple Past + Past Perfect για προηγούμενη πράξη. Επίσης Simple Present για συνήθεια.", "I was reading when he called.\nWhen I arrived, he had left.\nWhen I finish work, I walk home."], ["ever / never", "Present Perfect για εμπειρίες μέχρι τώρα. Past Perfect για εμπειρίες μέχρι ένα σημείο στο παρελθόν. Simple Present / Simple Past για συνήθειες.", "Have you ever flown?\nBefore that trip, I had never flown.\nHe never drinks coffee."], ["already / just / yet", "Συχνά Present Perfect για σχέση με το παρόν. Past Perfect όταν το σημείο αναφοράς είναι στο παρελθόν.", "I have just finished.\nI haven’t finished yet.\nWhen he called, I had already finished."], ["for + διάρκεια", "Present Perfect: κατάσταση από το παρελθόν έως τώρα. Simple Past: τελειωμένη διάρκεια. Past Perfect: διάρκεια μέχρι ένα παρελθοντικό σημείο.", "I have lived here for five years.\nI lived there for five years, then moved.\nBy 2020, I had lived there for five years."], ["since + αφετηρία", "Συχνά Present Perfect μέχρι τώρα ή Past Perfect μέχρι ένα σημείο στο παρελθόν. Μετά το since μπορεί να υπάρχει Simple Past.", "I have known her since 2020.\nI have known her since we met.\nBy 2024, I had known her since 2020."], ["so far, up to now, until now", "Συνήθως Present Perfect: απολογισμός μέχρι τώρα.", "We have completed three exercises so far."], ["recently / lately", "Συχνά Present Perfect. Το recently μπορεί επίσης να συνοδεύει Simple Past για πρόσφατο ολοκληρωμένο γεγονός.", "I have seen her recently.\nI recently bought a bike."], ["today, this week / month / year", "Present Perfect όταν μετράμε γεγονότα σε διάστημα που φτάνει έως τώρα. Simple Past για συγκεκριμένο τελειωμένο γεγονός μέσα στο ίδιο διάστημα.", "I have read two books this week.\nI spoke to her at nine today."], ["by + χρονικό σημείο στο παρελθόν", "Συχνά Past Perfect: ολοκλήρωση μέχρι εκείνο το σημείο. Δεν είναι αποκλειστικό γνώρισμα του χρόνου.", "By eight last night, I had finished my work."], ["by the time + παρελθοντική πρόταση", "Συχνά Simple Past στη δευτερεύουσα + Past Perfect για πράξη ήδη ολοκληρωμένη. Μπορεί να υπάρχει και Past Continuous για κατάσταση σε εξέλιξη.", "By the time we arrived, he had left.\nBy the time we arrived, it was raining."], ["before / after", "Δείχνουν σειρά, αλλά δεν επιβάλλουν Past Perfect. Μπορούν να συνδυάζονται με Simple Past ή με ενεστωτικούς χρόνους.", "After I had eaten, I went out.\nAfter I ate, I went out.\nI brush my teeth before I go to bed."], ["once, twice, three times", "Present Perfect για εμπειρίες έως τώρα. Simple Past σε τελειωμένο διάστημα. Past Perfect έως ένα παρελθοντικό σημείο.", "I have visited Paris twice.\nI visited Paris twice last year.\nBefore 2020, I had visited Paris twice."]]}]}, {"title": "Ρήματα κατάστασης", "blocks": [{"type": "text", "text": "Συνήθως δεν χρησιμοποιούνται σε continuous όταν δηλώνουν κατάσταση. Δεν πρόκειται για απόλυτη απαγόρευση."}, {"type": "table", "headers": ["Κατηγορία", "Ρήματα", "Παραδείγματα"], "rows": [["Γνώση και σκέψη", "know (γνωρίζω), understand (καταλαβαίνω), believe (πιστεύω), remember (θυμάμαι), forget (ξεχνώ), mean (σημαίνω)", "I knew the answer.\nΌχι: I was knowing the answer."], ["Επιθυμία και προτίμηση", "want (θέλω), need (χρειάζομαι), prefer (προτιμώ)", "She wanted a new bike.\nΌχι: She was wanting a new bike."], ["Συναισθήματα", "like (μου αρέσει), love (αγαπώ), hate (μισώ), dislike (δεν μου αρέσει)", "He liked the film.\nΓια ουδέτερο σχολικό λόγο αποφεύγουμε το was liking."], ["Κατοχή και σχέση", "have (έχω / κατέχω), own (κατέχω), possess (κατέχω), belong to (ανήκω σε)", "They had a car.\nΌχι: They were having a car."], ["Εντύπωση και σύσταση", "seem (φαίνομαι), appear (φαίνομαι), resemble (μοιάζω), contain (περιέχω), consist of (αποτελούμαι από)", "The box contained books.\nShe seemed tired."], ["Αισθήσεις ως κατάσταση", "see (βλέπω), hear (ακούω), smell (έχω μυρωδιά), taste (έχω γεύση)", "The soup tasted good.\nI could hear the music."]]}]}, {"title": "Όταν αλλάζει η σημασία", "blocks": [{"type": "table", "headers": ["Ρήμα", "Κατάσταση", "Διαφορετική χρήση"], "rows": [["have", "Κατοχή: She had a bicycle.", "Δραστηριότητα / εμπειρία: She was having a shower when I called."], ["think", "Γνώμη / πεποίθηση: I thought he was right.", "Σκέψη σε εξέλιξη: I was thinking about the problem."], ["see", "Όραση / αντίληψη: I could see the mountains.", "Συνάντηση / επίσκεψη: She was seeing the dentist at five."], ["taste", "Γεύση του πράγματος: The soup tasted salty.", "Δοκιμή: The chef was tasting the soup."], ["smell", "Μυρωδιά του πράγματος: The flowers smelled lovely.", "Ενέργεια: She was smelling the flowers."], ["look", "Εντύπωση: He looked tired.", "Ενέργεια: He was looking at a photograph."], ["feel", "Αίσθημα: I felt tired.", "Μπορεί να χρησιμοποιηθεί και continuous για προσωρινή αίσθηση: I was feeling tired. Επίσης ενέργεια αφής: She was feeling the fabric."], ["be", "Κατάσταση / χαρακτηριστικό: He was rude.", "Προσωρινή συμπεριφορά: He was being rude to the waiter."]]}]}]};</script></head><body data-page="exercises"><main><header><h1>60 ανακατεμένες ασκήσεις</h1></header><nav aria-label="Κύρια πλοήγηση"><a href="index.html">Κουίζ</a><a href="exercises.html">60 ασκήσεις</a><a href="rules.html">Κανόνες και πίνακες</a></nav><div id="app" class="card" aria-busy="true">Φόρτωση…</div><a class="pdf" href="English-Grammar-60-Exercises.pdf" download>Κατέβασε το PDF: ασκήσεις, λύσεις και κανόνες</a><footer><a href="English-Grammar-Quiz.html" download>Λήψη κουίζ για χρήση χωρίς διαδίκτυο</a></footer></main><script>async function loadContent(name){if(window.QUIZ_CONTENT)return window.QUIZ_CONTENT[name];const response=await fetch(`content/${name}.json`);if(!response.ok)throw new Error('Αδυναμία φόρτωσης');return response.json()}
