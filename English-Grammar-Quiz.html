<!doctype html><html lang="el"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Αγγλική γραμματική — Κουίζ 1</title><meta name="description" content="20 διαδραστικές ασκήσεις με βοήθεια, επεξηγήσεις και σκορ."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231e40af'/%3E%3Ctext x='32' y='46' text-anchor='middle' fill='white' font-size='44'%3EQ%3C/text%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#edf2fa;color:#17233a;font:16px/1.6 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:28px 18px}header{margin-bottom:24px;border-left:6px solid #2454d5;padding-left:18px}h1{font-size:clamp(23px,4vw,32px);line-height:1.3;margin:0}small{font-size:14px;color:#53647b}.card{background:white;border:1px solid #d8e1ef;border-radius:20px;padding:clamp(20px,4vw,36px);box-shadow:0 8px 30px #1e40af0a}.meta{display:flex;justify-content:space-between;font-weight:600;color:#435574}progress{width:100%;height:9px;accent-color:#2454d5;margin:12px 0 22px}h2{font-size:22px;line-height:1.6;overflow-wrap:anywhere}.options{display:grid;gap:12px}button{font:inherit;cursor:pointer;min-height:48px;border-radius:12px}.option{text-align:left;padding:13px 16px;background:white;border:2px solid #dbe3ef;display:flex;gap:14px;color:#17233a}.option:hover:not(:disabled){border-color:#527be1}.option b{background:#edf2fa;min-width:30px;text-align:center;border-radius:6px}.selected{border-color:#2454d5;background:#edf3ff}.correct{border-color:#18794e;background:#eaf8ef}.wrong{border-color:#c33434;background:#fff0f0}button:focus-visible,summary:focus-visible{outline:3px solid #e9a423;outline-offset:3px}button:disabled{cursor:default}details{margin:22px 0;color:#435574}summary{cursor:pointer}details p,.feedback{background:#f0f5ff;padding:16px;border-radius:12px}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.primary{background:#1e40af;color:white;border:0;padding:12px 24px}.primary:disabled{background:#a5b1c8}.secondary{border:1px solid #ced8e7;background:white;color:#334664;padding:10px 16px}.score{font-size:56px;font-weight:800;color:#1e40af}.review{border-top:1px solid #dbe3ef;padding:16px 0}.review p{margin:6px 0}footer{margin-top:20px;color:#56647a;font-size:14px}a{color:#1e40af}@media(max-width:450px){.actions{flex-wrap:wrap}.actions button{flex:1}h2{font-size:20px}}
nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}nav a,.pdf{display:inline-block;background:#fff;border:1px solid #cad5e5;border-radius:10px;padding:10px 14px;font-size:16px}.pdf{margin-top:20px;background:#1e40af;color:white;text-decoration:none}table{border-collapse:collapse;width:100%;min-width:550px;font-size:15px}td,th{padding:12px;border:1px solid #d8e1ef;text-align:left;vertical-align:top}th{background:#dce8ef}tr:nth-child(even){background:#f3f6f8}.tablewrap{overflow-x:auto;margin:18px 0 30px}section{margin-bottom:34px}details.solution{border-bottom:1px solid #dbe3ef;padding:12px 0}details.solution summary{color:#1e40af}h3{font-size:20px}</style><main><header><h1>Αγγλική γραμματική</h1><small>Κουίζ 1 · 20 ερωτήσεις</small></header><nav aria-label="Κύρια πλοήγηση"><a href="index.html">Κουίζ</a><a href="exercises.html">60 ασκήσεις</a><a href="rules.html">Κανόνες και πίνακες</a></nav><div id="app" class="card"></div><a class="pdf" href="English-Grammar-60-Exercises.pdf" download>Κατέβασε το PDF: ασκήσεις, λύσεις και κανόνες</a><footer>Simple Past · Past Continuous · Present Perfect · Past Perfect<br>Βρετανική ορθογραφία · <a href="English-Grammar-Quiz.html" download>Λήψη για χρήση χωρίς διαδίκτυο</a></footer></main><script>
const questions=[{"q": "Yesterday, Helen ___ (study) for her English test.", "o": ["studyed", "has studied", "studied", "had studyed"], "c": 2, "h": "Πρόσεξε το yesterday και το γράμμα πριν από το y.", "f": "Yesterday: Simple Past. Σύμφωνο + y: studied."}, {"q": "While Dad ___ (wash) the car, the phone ___ (ring).", "o": ["was washing — rang", "washed — was ringing", "has washed — has rung", "was wash — ringed"], "c": 0, "h": "Μία πράξη ήταν σε εξέλιξη όταν συνέβη η άλλη.", "f": "Was washing: πράξη σε εξέλιξη. Rang: σύντομο γεγονός."}, {"q": "I ___ never ___ (eat) sushi.", "o": ["have — ate", "has — eaten", "have — eat", "have — eaten"], "c": 3, "h": "Εμπειρία ζωής μέχρι τώρα.", "f": "Present Perfect: have + eaten. Eat → ate → eaten."}, {"q": "By the time we ___ (reach) the station, the train ___ already ___ (leave).", "o": ["had reached — left", "reached — had already left", "reached — has already left", "reach — had already leave"], "c": 1, "h": "Το τρένο έφυγε πριν φτάσουμε.", "f": "Reached: παρελθοντικό σημείο. Had left: προηγούμενη πράξη."}, {"q": "Mum isn’t here. She ___ to the supermarket and hasn’t returned yet.", "o": ["has been", "have gone", "has gone", "has went"], "c": 2, "h": "Έχει επιστρέψει;", "f": "Has gone: έχει φύγει και δεν έχει επιστρέψει."}, {"q": "They ___ (play) basketball last Saturday.", "o": ["played", "plaied", "have played", "playyed"], "c": 0, "h": "Πριν από το y υπάρχει φωνήεν ή σύμφωνο;", "f": "Last Saturday: Simple Past. Φωνήεν + y: played."}, {"q": "Συμπλήρωσε με Past Continuous: At eight o’clock last night, we ___ (have) dinner.", "o": ["was having", "were have", "were haveing", "were having"], "c": 3, "h": "Το have δηλώνει δραστηριότητα.", "f": "We + were having. Το have εδώ σημαίνει δραστηριότητα."}, {"q": "___ you ever ___ (be) to Italy?", "o": ["Has — been", "Have — been", "Have — was", "Did — been"], "c": 1, "h": "Ρωτά για εμπειρία επίσκεψης.", "f": "Have you ever been to…? Εμπειρία ζωής."}, {"q": "When Anna ___ (open) her bag, she ___ (realise) that she ___ (forget) her keys.", "o": ["opened — realised — had forgotten", "openned — realised — had forgotten", "opened — realised — had forgot", "opened — realised — has forgotten"], "c": 0, "h": "Η παράλειψη έγινε πριν ανοίξει την τσάντα.", "f": "Opened / realised: αόριστος. Had forgotten: προηγούμενη παράλειψη. Το open δεν διπλασιάζει το n."}, {"q": "The bus ___ (stop) outside our school yesterday.", "o": ["stoped", "has stopped", "stopped", "stopt"], "c": 2, "h": "Το stop είναι μονοσύλλαβο.", "f": "Stop → stopped, με διπλό p."}, {"q": "We ___ (not / finish) our project yet.", "o": ["haven’t finish", "haven’t finished", "hasn’t finished", "haven’t finishing"], "c": 1, "h": "Το έργο δεν έχει ολοκληρωθεί μέχρι τώρα.", "f": "We + haven’t finished: εκκρεμότητα έως τώρα."}, {"q": "While I ___ (walk) home, I ___ (see) an old friend.", "o": ["was walking — seen", "was walk — saw", "was walking — seed", "was walking — saw"], "c": 3, "h": "Το περπάτημα είναι το πλαίσιο της συνάντησης.", "f": "Was walking: διάρκεια. Saw: αόριστος του see."}, {"q": "By the time the guests ___ (arrive), Mum ___ (prepare) dinner.", "o": ["arrived — has prepared", "had arrived — prepared", "arrived — had prepared", "arrived — had prepare"], "c": 2, "h": "Το δείπνο είχε ετοιμαστεί πριν από την άφιξη.", "f": "Arrived: αόριστος. Had prepared: προγενέστερη ολοκλήρωση."}, {"q": "My parents ___ (travel) to London last summer. Χρησιμοποίησε βρετανική ορθογραφία.", "o": ["travelled", "travellied", "have travelled", "travelleded"], "c": 0, "h": "Θυμήσου τη βρετανική ορθογραφία του τελικού l.", "f": "Last summer: Simple Past. Βρετανική ορθογραφία: travelled."}, {"q": "“Where are Tom and Ben?” “They ___ to the park. They’ll be back soon.”", "o": ["have been", "have gone", "has gone", "have went"], "c": 1, "h": "Απουσιάζουν ακόμη.", "f": "They + have gone: δεν έχουν επιστρέψει."}, {"q": "Jack ___ (drop) his phone yesterday.", "o": ["droped", "has dropped", "dropt", "dropped"], "c": 3, "h": "Έλεγξε το τελικό σύμφωνο.", "f": "Drop → dropped με διπλό p."}, {"q": "Συμπλήρωσε με Past Continuous: At this time yesterday, Mary ___ (write) an email.", "o": ["was writing", "were writing", "was writeing", "was written"], "c": 0, "h": "Mary: ενικός και τύπος -ing.", "f": "Mary + was writing. Αφαιρούμε το e πριν από το -ing."}, {"q": "She ___ just ___ (carry) the shopping into the kitchen.", "o": ["has — carryed", "have — carried", "has — carried", "has — carrying"], "c": 2, "h": "Πρόσφατη ολοκλήρωση και σύμφωνο + y.", "f": "She + has carried. Σύμφωνο + y → ied."}, {"q": "When we ___ (get) to the cinema, we ___ (discover) that the film ___ already ___ (begin).", "o": ["got — discovered — had already began", "got — discovered — has already begun", "getted — discovered — had already begun", "got — discovered — had already begun"], "c": 3, "h": "Η έναρξη προηγήθηκε της άφιξης.", "f": "Got / discovered: αόριστος. Had begun: προηγούμενη έναρξη."}, {"q": "We ___ (enjoy) the school trip last Friday.", "o": ["enjoied", "enjoyed", "have enjoyed", "enjoyyed"], "c": 1, "h": "Ποιο γράμμα προηγείται του y;", "f": "Last Friday: Simple Past. Φωνήεν + y: enjoyed."}];let index=0,selected=null,checked=false,answers=[];const app=document.getElementById('app');
function el(t,s,c){let x=document.createElement(t);if(s!==undefined)x.textContent=s;if(c)x.className=c;return x}
function render(){app.replaceChildren();const q=questions[index],meta=el('div',undefined,'meta');meta.append(el('span',`Ερώτηση ${index+1} / ${questions.length}`),el('span',`Σκορ: ${answers.filter(a=>a.ok).length}`));app.append(meta);const p=el('progress');p.max=questions.length;p.value=index;p.setAttribute('aria-label','Πρόοδος');app.append(p);const h=el('h2',q.q);h.tabIndex=-1;app.append(h);const opts=el('div',undefined,'options');opts.setAttribute('role','group');opts.setAttribute('aria-label','Επιλογές απάντησης');q.o.forEach((s,i)=>{const b=el('button',undefined,'option');b.append(el('b','ABCD'[i]),el('span',s));b.disabled=checked;b.setAttribute('aria-pressed',String(selected===i));if(selected===i)b.classList.add('selected');if(checked&&i===q.c)b.classList.add('correct');if(checked&&i===selected&&i!==q.c)b.classList.add('wrong');b.onclick=()=>{selected=i;render();app.querySelectorAll('.option')[i].focus()};opts.append(b)});app.append(opts);const d=el('details');d.append(el('summary','Βοήθεια'),el('p',q.h));app.append(d);if(checked){const f=el('div',undefined,'feedback');f.setAttribute('role','status');f.append(el('strong',selected===q.c?'Σωστή απάντηση':'Σωστή απάντηση: '+q.o[q.c]),el('p',q.f));app.append(f)}const actions=el('div',undefined,'actions'),reset=el('button','Από την αρχή','secondary');reset.onclick=()=>{if(confirm('Να ξεκινήσεις από την αρχή;'))start()};const next=el('button',checked?(index===19?'Αποτέλεσμα':'Επόμενη ερώτηση'):'Έλεγχος','primary');next.disabled=selected===null;next.onclick=()=>{if(!checked){checked=true;answers.push({s:selected,ok:selected===q.c});render()}else if(index===19)finish();else{index++;selected=null;checked=false;render();app.querySelector('h2').focus()}};actions.append(reset,next);app.append(actions)}
function start(){index=0;selected=null;checked=false;answers=[];render()}
function finish(){app.replaceChildren();app.append(el('h2','Το κουίζ ολοκληρώθηκε!'),el('div',`${answers.filter(a=>a.ok).length} / 20`,'score'));const b=el('button','Ξανακάνε το κουίζ','primary');b.onclick=start;app.append(b);questions.forEach((q,i)=>{const r=el('div',undefined,'review');r.append(el('strong',`${i+1}. ${answers[i].ok?'Σωστό':'Χρειάζεται επανάληψη'}`),el('p',q.q),el('p','Η απάντησή σου: '+q.o[answers[i].s]),el('p','Σωστή απάντηση: '+q.o[q.c]),el('small',q.f));app.append(r)});window.scrollTo(0,0)}start();
</script></html>
